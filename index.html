<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ARGENTIMATE OS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#004aad">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna pensada para el celu; resumen del mes arriba, barra de pestañas fija abajo. */
:root{
  --azul:#004aad; --azul-2:#e6eefa; --crema:#fff7ed; --bg:#f6f8fc; --card:#ffffff;
  --fg:#16233a; --muted:#5f6b80; --line:#e2e8f2; --ok:#1d7a46; --ok-bg:#e3f4ea;
  --warn:#a65d00; --warn-bg:#fdeed6; --bad:#b3261e; --bad-bg:#fbe4e2; --chip:#eef2f8;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --azul:#6ea0ff; --azul-2:#14264a; --crema:#1c2333; --bg:#10151f; --card:#171e2b;
  --fg:#eef1f7; --muted:#9aa5b8; --line:#283246; --ok:#6fd49a; --ok-bg:#16301f;
  --warn:#f2b45c; --warn-bg:#3a2a12; --bad:#ff8a80; --bad-bg:#3b1a18; --chip:#212a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --azul:#6ea0ff; --azul-2:#14264a; --crema:#1c2333; --bg:#10151f; --card:#171e2b;
  --fg:#eef1f7; --muted:#9aa5b8; --line:#283246; --ok:#6fd49a; --ok-bg:#16301f;
  --warn:#f2b45c; --warn-bg:#3a2a12; --bad:#ff8a80; --bad-bg:#3b1a18; --chip:#212a3a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:24px;font-weight:800;color:var(--azul);letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--azul)}
.monthnav b{font-weight:600;font-size:14px;min-width:92px;text-align:center;text-transform:capitalize}
.status{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 12px;margin-bottom:10px}
/* resumen */
.sum{background:var(--azul);color:#fff;border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:1.3fr 1fr;gap:10px 16px}
:root[data-theme="dark"] .sum{color:#0b1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sum{color:#0b1220}}
.sum .big{font-family:var(--display);font-size:32px;font-weight:800;line-height:1.05}
.sum .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.sum .mini{display:flex;flex-direction:column;gap:6px;justify-content:center}
.sum .mini div{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.canalbar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;opacity:.95}
.canalbar i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:currentColor;opacity:.6}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:20}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;max-width:720px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--display);font-size:20px;font-weight:800;display:block;overflow-wrap:anywhere}
.kpi.res{background:var(--azul);border-color:var(--azul);color:var(--card)}
.kpi.res .lbl{color:inherit;opacity:.85}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar .t{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.bar .t span{display:block;height:100%;background:var(--bad);opacity:.75;border-radius:5px}
.bar.c .t span{background:var(--azul)}
@media (max-width:420px){.kpis{grid-template-columns:1fr 1fr}.kpi.res{grid-column:1/-1}.bar{grid-template-columns:92px 1fr auto}}
nav.tabs button{border:0;background:none;padding:8px 4px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--azul);background:var(--azul-2)}
nav.tabs button.plus[aria-current="page"],nav.tabs button.plus{color:var(--azul)}
section.view{padding-top:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:var(--card)}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
/* tarjetas de venta */
.day{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:4px;display:flex;justify-content:space-between}
.venta{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.vhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.vhead .who{min-width:0}
.vhead .who b{display:block;font-size:16px}
.vhead .items{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.vtotal{font-family:var(--display);font-weight:800;font-size:19px;white-space:nowrap}
.tag{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.st{border:0;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700}
.st.pend{background:var(--warn-bg);color:var(--warn)}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.info{background:var(--azul-2);color:var(--azul)}
.vfoot{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vfoot .sp{flex:1}
.ghost{border:0;background:none;color:var(--azul);font-weight:600;font-size:13.5px;padding:5px 6px}
.ghost.danger{color:var(--bad)}
.detail{border-top:1px dashed var(--line);padding-top:8px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.detail .l{display:flex;justify-content:space-between;gap:10px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
/* formulario */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:17px;font-weight:600;font-family:var(--body)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0;flex:1}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;font-size:16px;font-weight:400;color:var(--fg);width:100%}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line{display:grid;grid-template-columns:1fr 64px 108px 30px;gap:6px;align-items:center}
.line input{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px;font-size:15px;width:100%;min-width:0}
.line .x{border:0;background:none;color:var(--bad);font-size:20px}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.results button{border:0;border-bottom:1px solid var(--line);background:var(--card);text-align:left;padding:9px 11px;display:flex;justify-content:space-between;gap:10px}
.results button:last-child{border-bottom:0}
.results small{color:var(--muted)}
.totbox{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.totbox b{font-family:var(--display);font-size:26px;font-weight:800;color:var(--azul)}
.primary{border:0;background:var(--azul);color:var(--card);border-radius:14px;padding:14px;font-weight:700;font-size:16px;width:100%}
.secondary{border:1px solid var(--azul);background:none;color:var(--azul);border-radius:12px;padding:10px 14px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.paste{background:var(--crema);border-color:var(--line)}
/* clientes / productos */
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .m{min-width:0}
.li .m b{display:block;overflow-wrap:anywhere}
.li .m small{color:var(--muted)}
.li .r{text-align:right;white-space:nowrap}
.li .r small{display:block;color:var(--muted)}
.prodedit{display:grid;grid-template-columns:1fr 120px;gap:8px}
/* sellos: el panel va en su propio marco, a todo el ancho disponible */
#panelFrame{display:block;width:100%;min-height:70vh;border:0;border-radius:14px;background:transparent}
@media (max-width:420px){nav.tabs button{font-size:11px;padding:8px 1px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:420px){.sum{grid-template-columns:1fr}.line{grid-template-columns:1fr 52px 96px 26px}}
@media (prefers-reduced-motion:no-preference){.venta,.card{transition:border-color .15s}}
/* ARGENTIMATE OS: shell, dashboard e inventario */
.logo{width:34px;height:34px;border-radius:9px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.brand{align-items:center}
header.top{flex-wrap:wrap}
.brand h1{font-size:19px;letter-spacing:.01em;white-space:nowrap}
.brand h1 em,.navbrand em{font-style:normal;font-weight:600;color:var(--muted)}
.navbrand{display:none}
.gs{position:relative;margin-bottom:12px;display:flex}
.gres{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:25;box-shadow:0 8px 24px rgba(16,35,70,.14);max-height:60vh;overflow:auto;background:var(--card)}
.gres .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted);padding:8px 11px 3px}
#moreBtn{display:flex}
.mobx{display:none!important}
nav.tabs.open .mobx{display:flex!important}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;text-align:left}
.tile .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.tile b{display:block;font-family:var(--display);font-size:23px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.tile small{color:var(--muted);font-size:12px;display:block}
.tile.hero{background:var(--azul);border-color:var(--azul);color:var(--card)}
.tile.hero .lbl,.tile.hero small{color:inherit;opacity:.85}
button.tile{cursor:pointer}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.qa button{white-space:nowrap;padding:8px 12px;font-size:14px}
.cols{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--line);position:relative}
.col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0;background:none;border:0;padding:0}
.col span{display:block;width:min(70%,34px);min-height:2px;background:var(--azul);border-radius:4px 4px 0 0}
.col:hover span,.col:focus-visible span{opacity:.75}
.colx{display:flex;gap:2px;font-size:11.5px;color:var(--muted)}
.colx span{flex:1;text-align:center;min-width:0;overflow:hidden;white-space:nowrap;text-transform:capitalize}
.tip{position:fixed;z-index:40;background:var(--fg);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:8px;pointer-events:none;max-width:220px}
.bar.c .t span{background:var(--azul);opacity:1}
.meter{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.meter span{display:block;height:100%;background:var(--azul);border-radius:5px;transition:width .3s}
.goal{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.goal .l{display:flex;justify-content:space-between;gap:8px}
.task{display:flex;align-items:center;gap:8px;font-size:14px}
.task input{width:20px;height:20px;accent-color:var(--azul);flex:none}
.task span{flex:1;min-width:0;overflow-wrap:anywhere}
.task.ok span{text-decoration:line-through;color:var(--muted)}
.alert{display:flex;gap:8px;align-items:center;justify-content:space-between;border:0;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600;text-align:left;width:100%}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.more3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
details.card summary{cursor:pointer}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px}
@media (prefers-reduced-motion:reduce){.meter span{transition:none}}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:960px){
  body{padding-left:272px;padding-right:24px;padding-bottom:32px}
  .wrap{max-width:1080px}
  header.top .brand{display:none}
  header.top{justify-content:flex-end;min-height:20px;padding-block:14px 8px}
  nav.tabs{top:0;right:auto;bottom:0;width:248px;border-top:0;border-right:1px solid var(--line);justify-content:flex-start;padding:16px 12px}
  nav.tabs .in{display:flex;flex-direction:column;gap:3px}
  nav.tabs button{flex-direction:row;gap:11px;padding:10px 12px;font-size:14.5px}
  nav.tabs button svg{width:20px;height:20px}
  .navbrand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;font-family:var(--display);font-size:16px;color:var(--azul);font-weight:800}
  #moreBtn{display:none}
  .mobx{display:flex!important}
  .toast{bottom:24px}
}
.tw{overflow-x:auto}
table.ft{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.ft th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ft td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ft th:first-child,.ft td:first-child{text-align:left;padding-left:0;white-space:normal;min-width:84px}
.ft tr:last-child td{border-bottom:0}
.ft .neg{color:var(--bad)}
.monthnav b{text-transform:none}
.monthnav b::first-letter{text-transform:uppercase}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--muted);opacity:.55}
.dot.on{background:var(--azul);border:1.5px solid var(--azul);opacity:1}
.dots.full .dot.on{background:var(--ok);border-color:var(--ok)}
.hist{border-top:1px dashed var(--line);padding-top:8px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.hist .l{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hoja{background:#fff;color:#16233a;border:1px solid #e2e8f2;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hoja small{display:block;color:#5f6b80}
.hoja .ft th,.hoja .ft td{color:#16233a;border-color:#e2e8f2}
.hoja-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hoja-em{display:flex;gap:10px;align-items:flex-start}
.hoja-em img{width:48px;height:48px;object-fit:contain}
.hoja-tit{text-align:right;margin-left:auto}
.hoja-tit b{display:block;font-family:var(--display);font-size:20px;color:#004aad}
.hoja-cli b{display:block}
.hoja-tot{align-self:flex-end;min-width:210px;font-variant-numeric:tabular-nums}
.hoja-tot div{display:flex;justify-content:space-between;gap:20px}
.hoja-tot .t{font-weight:800;font-size:18px;color:#004aad;border-top:1px solid #e2e8f2;margin-top:4px;padding-top:4px}
.hoja-ley{text-align:center;font-weight:700;font-size:12.5px;color:#b3261e;border-top:1px dashed #e2e8f2;padding-top:8px}
.hoja p{margin:0;font-size:13.5px}
.chip:disabled{opacity:.5}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.kcol{background:var(--chip);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;scroll-snap-align:start}
.kcol h3{margin:0;font-size:14px;font-family:var(--body);display:flex;justify-content:space-between;align-items:center;gap:6px}
.adj2{min-width:36px;font-size:17px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--azul);font-weight:700;padding:2px 8px}
header.top{position:relative}
.bell{position:relative;margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--azul);display:flex;align-items:center;justify-content:center;flex:none}
.bell svg{width:20px;height:20px}
.bell span{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bellbox{position:absolute;right:0;top:calc(100% + 2px);width:min(340px,100%);z-index:26;box-shadow:0 8px 24px rgba(16,35,70,.14);max-height:60vh;overflow:auto;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.calh{text-align:center;font-size:11.5px;color:var(--muted);font-weight:600}
.cald{min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px}
.cald b{font-weight:500}
.cald i{font-style:normal;font-size:11px;font-weight:700;color:var(--card);background:var(--azul);border-radius:9px;min-width:17px;line-height:17px;text-align:center}
.cald.hoy{border-color:var(--azul)}
.cald.sel{background:var(--azul-2);border-color:var(--azul)}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked+span{background:var(--azul)}
.sw input:checked+span::after{left:21px}
.sw input:focus-visible+span{outline:2px solid var(--azul);outline-offset:2px}
pre.rep{margin:0;white-space:pre-wrap;font:14px/1.5 var(--body);overflow-wrap:anywhere}
.achat{display:flex;flex-direction:column;gap:8px}
.amsg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere;min-width:0}
.amsg.u{align-self:flex-end;background:var(--azul);border-color:var(--azul);color:var(--card);max-width:85%}
button.tile{width:100%;margin-bottom:0}
/* borradores, fotos y pagos a proveedores */
.fotos{display:flex;flex-wrap:wrap;gap:10px}
.foto{position:relative;width:76px;height:76px;flex:none}
.foto a{display:block;width:100%;height:100%}
.foto img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:var(--chip)}
.foto .x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--bad);font-size:16px;line-height:1;padding:0}
.bitem{display:grid;grid-template-columns:minmax(0,1.6fr) 56px minmax(0,1fr) 28px;gap:6px;align-items:center}
.bitem input{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px;font-size:15px;width:100%;min-width:0}
.bitem .x{border:0;background:none;color:var(--bad);font-size:20px;padding:0}
@media (max-width:480px){.bitem{grid-template-columns:minmax(0,1fr) 56px 28px}.bitem>:nth-child(3){grid-column:1/3;grid-row:2}.bitem.hint{display:none}}
.blist{display:flex;flex-direction:column;gap:3px;font-size:14px}
.blist div{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.grab{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--warn-bg);color:var(--warn)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:8px;padding:9px 12px;border-radius:10px;background:var(--azul-2);color:var(--azul);font-weight:700}
.mhead>span:first-child{display:inline-block}.mhead>span:first-child::first-letter{text-transform:uppercase}
.mhead small{font-weight:600;text-transform:none}
pre.raw{margin:0;white-space:pre-wrap;font:13.5px/1.45 var(--body);color:var(--muted);overflow-wrap:anywhere}
label.secondary{display:inline-flex;align-items:center;cursor:pointer}
.lbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lbox img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
/* precios */
.pclist{display:flex;flex-direction:column;gap:8px}
.pcrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;align-items:end}
.pcrow .pcn{grid-column:1/-1;min-width:0;overflow-wrap:anywhere}
.pcrow .pco{grid-column:1/-1}
.pcrow input.num{min-width:0;width:100%}
.pcbar{position:sticky;bottom:12px;z-index:20;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(16,35,70,.14)}
.pcbar[hidden]{display:none}
.pcbar span{flex:1;font-weight:600;min-width:140px}
@media(min-width:900px){.pcrow{grid-template-columns:minmax(0,1fr) repeat(4,104px) 76px}.pcrow .pcn{grid-column:auto}.pcrow .pco{grid-column:auto}}

</style>

<script type="text/plain" id="panelShim">
(function () {
  var KEY = 'argentimate-sellos-v1', store = {}, blobs = {};
  var send = function (m) { parent.postMessage(m, '*'); };
  store[KEY] = __INIT__;
  Object.defineProperty(window, 'localStorage', { configurable: true, value: {
    getItem: function (k) { return Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null; },
    setItem: function (k, v) { store[k] = String(v); if (k === KEY) send({ sellos: 'save', json: store[k] }); },
    removeItem: function (k) { delete store[k]; }, clear: function () {}, key: function () { return null; }, length: 0
  } });
  addEventListener('message', function (e) {
    if (e.source !== parent || !e.data || e.data.sellos !== 'state') return;
    store[KEY] = e.data.json;
    dispatchEvent(new StorageEvent('storage', { key: KEY }));
  });
  // El marco del CRM no deja descargar directo: la copia de seguridad se baja a través del CRM.
  var createUrl = URL.createObjectURL;
  URL.createObjectURL = function (b) { var u = createUrl.call(URL, b); blobs[u] = b; return u; };
  var click = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    if (this.download && blobs[this.href]) { send({ sellos: 'download', filename: this.download, blob: blobs[this.href] }); return; }
    return click.call(this);
  };
  // Tampoco deja abrir ventanas nuevas: esos links se copian para pegarlos.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[target="_blank"]');
    if (!a) return;
    e.preventDefault();
    var url = a.href, tell = function (ok) { send({ sellos: 'link', url: url, copied: ok }); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { tell(true); }, function () { tell(false); });
    else tell(false);
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var hint = document.querySelector('#backup .hint');
    if (hint) hint.textContent = 'Tus clientes y cupones se guardan en el CRM. Esta copia sirve para traer los datos que tenías en otro navegador y para guardar un respaldo.';
    var report = function () { var h = Math.ceil(document.body.getBoundingClientRect().height); if (h > 0) send({ sellos: 'height', h: h + 8 }); };
    if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
    report();
    send({ sellos: 'ready' });
  });
})();
</script>

<script>
/* App propia: reemplaza la base de Claude por Firebase, con la misma forma de uso.
   Firestore guarda en el dispositivo y sincroniza cuando hay internet. Sin conexión sus escrituras
   no terminan hasta volver a conectarse, así que acá se dan por hechas enseguida: el dato ya quedó
   guardado en el dispositivo y aparece en pantalla. */
(function () {
  window.__OS_STANDALONE = true;
  var cfg = window.FIREBASE_CONFIG || {};
  var aviso = function (t) { if (typeof toast === 'function') toast(t); };
  var pronto = function (p) {
    p.catch(function (e) { console.error(e); aviso(e && e.code === 'permission-denied' ? 'Sin permiso para guardar. Revisá tu usuario.' : 'Un cambio no se pudo sincronizar.'); });
    return Promise.race([p, new Promise(function (ok) { setTimeout(ok, 600); })]);
  };
  function envolver(fs) {
    var escuchar = function (ref, next, err) {
      return ref.onSnapshot(function (s) {
        next(s.docs ? { docs: s.docs, size: s.size, empty: s.empty, metadata: { fromCache: false } } : { id: s.id, exists: s.exists, data: function () { return s.data(); }, metadata: { fromCache: false } });
      }, err);
    };
    var doc = function (ref) {
      return {
        id: ref.id, path: ref.path,
        get: function () { return ref.get(); },
        set: function (d) { return pronto(ref.set(d)); },
        update: function (d) { return pronto(ref.update(d)); },
        delete: function () { return pronto(ref.delete()); },
        onSnapshot: function (n, e) { return escuchar(ref, n, e); }
      };
    };
    var consulta = function (q, col) {
      return {
        orderBy: function (f, d) { return consulta(q.orderBy(f, d || 'asc'), col); },
        onSnapshot: function (n, e) { return escuchar(q, n, e); },
        get: function () { return q.get(); },
        doc: function (id) { return doc(id ? col.doc(id) : col.doc()); },
        add: function (d) { var r = col.doc(); return pronto(r.set(d)).then(function () { return doc(r); }); }
      };
    };
    return {
      collection: function (p) { var c = fs.collection(p); return consulta(c, c); },
      doc: function (p) { return doc(fs.doc(p)); }
    };
  }
  window.__osEnvolver = envolver;
  var bajar = {
    save: function (r) {
      var b = r.data instanceof Blob ? r.data : new Blob([r.data]), a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = r.filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      return Promise.resolve({});
    }
  };
  var css = '#osLogin{position:fixed;inset:0;z-index:100;background:#f6f8fc;color:#16233a;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif}' +
    '#osLogin form{background:#fff;border:1px solid #e2e8f2;border-radius:16px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}' +
    '#osLogin h1{margin:0;font-size:21px;color:#004aad}#osLogin p{margin:0;font-size:14px;color:#5f6b80}' +
    '#osLogin label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}' +
    '#osLogin input{font-size:16px;padding:11px;border:1px solid #e2e8f2;border-radius:10px}' +
    '#osLogin .go{border:0;background:#004aad;color:#fff;border-radius:12px;padding:13px;font-size:16px;font-weight:700}' +
    '#osLogin .lk{border:0;background:none;color:#004aad;font-size:14px;padding:4px}#osLogin .er{color:#b3261e;font-size:14px;min-height:18px}';
  function pantalla(html) {
    var v = document.getElementById('osLogin');
    if (!v) { var s = document.createElement('style'); s.textContent = css; document.head.appendChild(s); v = document.createElement('div'); v.id = 'osLogin'; document.body.appendChild(v); }
    v.innerHTML = html; return v;
  }
  function pedirIngreso(auth) {
    var v = pantalla('<form novalidate><h1>ARGENTIMATE OS</h1><p>Entrá con tu usuario.</p><label>Email<input id="lgE" type="email" autocomplete="username" required></label><label>Contraseña<input id="lgP" type="password" autocomplete="current-password" required></label><button class="go" type="submit">Entrar</button><button class="lk" type="button" id="lgR">Olvidé mi contraseña</button><div class="er" id="lgX" role="alert"></div></form>');
    var err = function (t) { document.getElementById('lgX').textContent = t; };
    v.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var m = document.getElementById('lgE').value.trim(), p = document.getElementById('lgP').value;
      if (!m || !p) { err('Completá el email y la contraseña.'); return; }
      err('Entrando…');
      auth.signInWithEmailAndPassword(m, p).catch(function (x) {
        err(x.code === 'auth/network-request-failed' ? 'Para entrar la primera vez necesitás internet.' : 'Email o contraseña incorrectos.');
      });
    });
    document.getElementById('lgR').addEventListener('click', function () {
      var m = document.getElementById('lgE').value.trim();
      if (!m) { err('Escribí tu email primero.'); return; }
      auth.sendPasswordResetEmail(m).then(function () { err('Te mandamos un email para cambiarla.'); }, function () { err('No se pudo enviar. Revisá el email y la conexión.'); });
    });
  }
  var db = new Promise(function (listo) {
    window.addEventListener('DOMContentLoaded', function () {
      if (!cfg.apiKey || !window.firebase) {
        pantalla(window.firebase ? '<form><h1>Falta configurar Firebase</h1><p>Completá firebase-config.js siguiendo la guía.</p></form>' : '<form><h1>Sin conexión</h1><p>La primera vez la app necesita internet para terminar de instalarse.</p></form>');
        return;
      }
      firebase.initializeApp(cfg);
      var fs = firebase.firestore();
      fs.settings({ ignoreUndefinedProperties: true, merge: true });

        var auth = firebase.auth(), hecho = false;
        window.__osSalir = function () { auth.signOut().then(function () { location.reload(); }); };

          if (!hecho) { hecho = true; listo(envolver(fs)); }

  });

  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();

<script>

async function exportCSV(){
  const rows=[["Fecha","Canal","Cliente","Teléfono","Productos","Envío","Descuento","Total","Medio","Pago","Entrega","Notas"]];
  (vAll?ventas.slice().sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")):monthVentas()).forEach(v=>rows.push([v.fecha,v.canal,v.nombre,v.tel,(v.items||[]).map(i=>i.cant+"x "+i.nombre+" ("+i.precio+")").join(" | "),v.envio||0,v.descuento||0,totalOf(v),v.medio,v.pago==="pagado"?"Pagado":"Por cobrar",(ENTREGA.find(e=>e[0]===v.entrega)||ENTREGA[0])[1],v.notas||""]));
  const csv="﻿"+rows.map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(";")).join("\n");
  try{await downloads.save({filename:vAll?"ventas-todas-"+today()+".csv":"ventas-"+month+".csv",data:new Blob([csv],{type:"text/csv"})})}catch(e){toast("No se descargó el archivo")}
}

    ${form.items.length?`<div class="line hint"><span>Producto</span><span>Cant.</span><span>Precio c/u</span><span></span></div>`:""}
    ${form.items.map((i,k)=>`<div class="line"><input data-in="${k}" data-k="nombre" value="${esc(i.nombre)}" aria-label="Producto"><input data-in="${k}" data-k="cant" value="${i.cant}" inputmode="numeric" class="num" aria-label="Cantidad"><input data-in="${k}" data-k="precio" value="${i.precio}" inputmode="numeric" class="num" aria-label="Precio"><button class="x" data-rm="${k}" aria-label="Quitar">×</button></div>`).join("")}

function refreshTotal(){const t=$("#fTot");if(t)t.textContent=money(totalOf(form));saveDraft()}
const nv=$("#v-nueva");
nv.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="pSearch"){prodSearch=t.value;const pos=t.selectionStart;renderNueva();const n=$("#pSearch");n.focus();n.setSelectionRange(pos,pos);return}
  if(t.dataset.in!==undefined){const i=form.items[+t.dataset.in];const k=t.dataset.k;
    if(k==="nombre")i.nombre=t.value;else{const n=+t.value.replace(/[^\d]/g,"")||0;i[k]=n;if(k==="precio")i.manual=true}refreshTotal();return}
  const map={fNombre:"nombre",fTel:"tel",fFecha:"fecha",fNotas:"notas"};
  if(map[t.id]){form[map[t.id]]=t.value;
    if(t.id==="fNombre"&&!form.tel){const prev=ventas.find(v=>norm(v.nombre)===norm(t.value)&&v.tel);if(prev){form.tel=prev.tel;$("#fTel").value=prev.tel}}
    saveDraft();return}
  if(t.id==="fEnvio"){form.envio=+t.value.replace(/[^\d]/g,"")||0;refreshTotal()}
  if(t.id==="fDesc"){form.descuento=+t.value.replace(/[^\d]/g,"")||0;refreshTotal()}
});
nv.addEventListener("change",e=>{if(e.target.id==="fSello"){form.sumaSello=e.target.checked;saveDraft()}if(e.target.id==="fCamp"){form.campana=e.target.value;saveDraft()}if(e.target.id==="fMedio"){form.medio=e.target.value;
  form.items.forEach(i=>{if(i.pid&&!i.manual){const p=productos.find(x=>x.id===i.pid);if(p)i.precio=priceFor(p)}});saveDraft();renderNueva()}});
nv.addEventListener("keydown",e=>{if(e.target.id==="pSearch"&&e.key==="Enter"){e.preventDefault();const q=norm(prodSearch);const m=productos.find(p=>norm(p.nombre).includes(q));if(m)addProd(m);else if(prodSearch.trim())addFree()}});
function addProd(p){const ex=form.items.find(i=>i.pid===p.id);if(ex)ex.cant++;else form.items.push({pid:p.id,nombre:p.nombre,cant:1,precio:priceFor(p)});prodSearch="";saveDraft();renderNueva();$("#pSearch").focus()}
function addFree(){form.items.push({nombre:prodSearch.trim(),cant:1,precio:0});prodSearch="";saveDraft();renderNueva();const ins=nv.querySelectorAll('[data-k="precio"]');ins[ins.length-1]?.focus()}
nv.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.canal){form.canal=d.canal;saveDraft();renderNueva()}
  else if(d.addp){addProd(productos.find(p=>p.id===d.addp))}
  else if(d.addfree!==undefined){addFree()}
  else if(d.rm){form.items.splice(+d.rm,1);saveDraft();renderNueva()}
  else if(d.pagof){form.pago=d.pagof;saveDraft();renderNueva()}
  else if(d.entf){form.entrega=d.entf;saveDraft();renderNueva()}
  else if(b.id==="clearBtn"){pedDudas=[];editingId=null;form=blank();store("argv-draft",form);renderNueva()}
  else if(b.id==="saveBtn")saveVenta();
  else if(b.id==="pasteBtn")parsePaste();
  else if(d.pedalt!==undefined){const x=pedDudas[+d.pedalt],p=productos.find(y=>y.id===d.pid);if(x&&p){const viejo=productos.find(y=>y.id===x.it.pid);x.it.pid=p.id;x.it.nombre=p.nombre;if(!x.it.manual)x.it.precio=priceFor(p);x.opts=[viejo,...x.opts.filter(y=>y.id!==p.id)].filter(Boolean);saveDraft();renderNueva()}}
});
async function saveVenta(){
  form.items=form.items.filter(i=>i.nombre&&i.cant>0);
  if(!form.nombre.trim()&&!form.items.length){toast("Poné al menos el cliente o un producto");return}
  const data={...form,nombre:form.nombre.trim(),tel:form.tel.trim(),total:totalOf(form),items:form.items.map(({manual,...i})=>i)};
  const b=$("#saveBtn");b.disabled=true;
  const prev=editingId?ventas.find(x=>x.id===editingId):null,vid=editingId||nuevoIdVenta(),sp=planSello(prev,data);
  Object.assign(data,sp.patch);
  const bid=!editingId&&form.borradorId?form.borradorId:"";
  const ok=editingId
    ?await guard(async()=>{await db.doc("ventas/"+vid).update(data);await aplicarSello(sp)},sp.aviso||"Cambios guardados")
    :await guard(async()=>{await db.doc("ventas/"+vid).set({...data,creado:Date.now()});await aplicarSello(sp)},sp.aviso||"Venta guardada");
  if(ok&&sp.doc)openId=vid;
  b.disabled=false;
  if(ok&&bid&&borradores.some(x=>x.id===bid))guard(()=>db.doc("borradores/"+bid).update({estado:"venta",ventaId:vid,ventaFecha:data.fecha}));
  if(ok){pedDudas=[];month=form.fecha.slice(0,7);editingId=null;form=blank();store("argv-draft",form);go("ventas")}
}
async function parsePaste(){
  const txt=($("#pasteTxt")?.value||"").trim();const msg=$("#pasteMsg");
  if(!txt){toast("Pegá primero el mensaje");return}
  if(!sample){aplicarPedido(txt);return}
  const btn=$("#pasteBtn");btn.disabled=true;msg.textContent="Leyendo el pedido…";
  const cat=productos.slice(0,300).map(p=>p.nombre).join("\n");
  try{
    const r=await sample.json(`Sos asistente de una tienda argentina de mates (Argentimate). Del siguiente mensaje o pedido extraé los datos de la venta.
Respondé SOLO un objeto JSON así: {"nombre":"", "tel":"", "canal":"WhatsApp|Web|Mercado Libre|Empresas|Otro", "medio":"Transferencia|Tarjeta / MP|Efectivo|", "items":[{"nombre":"", "cant":1, "precio":0}], "envio":0, "notas":""}
Reglas: usá el nombre EXACTO del catálogo cuando el producto coincida; precio solo si el mensaje lo dice (número entero en pesos, si no 0); canal "Web" si parece un pedido de la tienda online; campos desconocidos vacíos; en notas poné dirección, grabado o pedidos especiales.
CATÁLOGO:
${cat||"(vacío)"}

MENSAJE:
${txt.slice(0,6000)}`,{modelTier:"quick"});
    if(r&&typeof r==="object"){
      if(r.nombre)form.nombre=String(r.nombre);if(r.tel)form.tel=String(r.tel);
      if(CANALES.includes(r.canal))form.canal=r.canal;if(MEDIOS.includes(r.medio))form.medio=r.medio;
      if(+r.envio)form.envio=+r.envio;if(r.notas)form.notas=[form.notas,String(r.notas)].filter(Boolean).join(" · ");
      (Array.isArray(r.items)?r.items:[]).forEach(it=>{const p=productos.find(x=>norm(x.nombre)===norm(it.nombre));
        const cant=Math.max(1,+it.cant||1);
        if(p)form.items.push({pid:p.id,nombre:p.nombre,cant,precio:+it.precio||priceFor(p),manual:!!+it.precio});
        else if(it.nombre)form.items.push({nombre:String(it.nombre),cant,precio:+it.precio||0})});
      saveDraft();renderNueva();toast("Revisá los datos y guardá");
    }
  }catch(e){btn.disabled=false;
    if(["not_granted","sampling_disabled","capability_disabled","capability_removed","not_declared"].includes(e.code)){sample=null;renderNueva();toast("Completá el formulario a mano")}
    else msg.textContent=e.code==="rate_limited"?"Muchos pedidos seguidos, probá en un rato.":"No pude leerlo. Probá de nuevo o cargalo a mano.";}
}

/* ---------- caja ---------- */
const CUENTAS=["Mercado Pago","Banco / Transferencia","Efectivo","Tarjeta de crédito"];
const CAT_E=["Proveedor","Envíos","Packaging","Publicidad","Comisiones","Plataformas","Suscripciones","Impuestos","Retiro personal","Otro"];
const CAT_I=["Venta","Aporte","Otro"];
const cuentaDe=m=>m==="Tarjeta / MP"?"Mercado Pago":m==="Efectivo"?"Efectivo":"Banco / Transferencia";
let movs=[], pasteRows=null, cajaCuenta="Todas";
const blankMov=()=>({tipo:"egreso",monto:"",fecha:today(),cuenta:"Tarjeta de crédito",categoria:"Proveedor",nota:""});
let mov=blankMov();
function cajaRows(){
  const vs=monthVentas().filter(v=>v.pago==="pagado").map(v=>({auto:true,id:"v"+v.id,fecha:v.fecha,tipo:"ingreso",monto:totalOf(v),cuenta:cuentaDe(v.medio),categoria:"Venta",nota:v.nombre||""}));
  const ms=movs.filter(m=>(m.fecha||"").startsWith(month));
  return [...vs,...ms].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
}
function renderCaja(){
  const all=cajaRows();
  const rows=cajaCuenta==="Todas"?all:all.filter(r=>r.cuenta===cajaCuenta);
  const ing=rows.filter(r=>r.tipo==="ingreso"&&(cajaCuenta!=="Todas"||r.categoria!==INTERNA)).reduce((a,r)=>a+(+r.monto||0),0);
  const egr=rows.filter(r=>r.tipo==="egreso"&&(cajaCuenta!=="Todas"||r.categoria!==INTERNA)).reduce((a,r)=>a+(+r.monto||0),0);
  const res=ing-egr;
  const byCat={};rows.filter(r=>r.tipo==="egreso"&&r.categoria!==INTERNA).forEach(r=>byCat[r.categoria]=(byCat[r.categoria]||0)+(+r.monto||0));
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const maxC=cats[0]?.[1]||1;
  const byCta={};all.forEach(r=>{byCta[r.cuenta]=(byCta[r.cuenta]||0)+(r.tipo==="ingreso"?1:-1)*(+r.monto||0)});
  const cats2=mov.tipo==="egreso"?CAT_E:CAT_I;
  let list="",last="";
  rows.forEach(r=>{
    if(r.fecha!==last){last=r.fecha;list+=`<div class="day"><span>${new Date(r.fecha+"T12:00").toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"short"})}</span></div>`}
    list+=`<div class="li"><div class="m"><b>${esc(r.categoria)}${r.nota?` · <span style="font-weight:500">${esc(r.nota)}</span>`:""}</b><small>${esc(r.cuenta)}${r.auto?" · desde Ventas":""}</small></div>
      <div class="r"><b class="num ${r.tipo==="ingreso"?"pos":"neg"}">${r.tipo==="ingreso"?"+":"−"}${money(r.monto)}</b>${r.auto?"":`<button class="ghost danger" data-mdel="${r.id}">${delArm==="m"+r.id?"¿Borrar?":"Borrar"}</button>`}</div></div>`;
  });
  $("#v-caja").innerHTML=`
  <div class="chips">${["Todas",...CUENTAS].map(c=>`<button class="chip" data-cta="${c}" aria-pressed="${cajaCuenta===c}">${c}</button>`).join("")}</div>
  <div class="kpis">
    <div class="kpi"><span class="lbl">Ingresos</span><b class="num pos">${money(ing)}</b></div>
    <div class="kpi"><span class="lbl">Egresos</span><b class="num neg">${money(egr)}</b></div>
    <div class="kpi res"><span class="lbl">Resultado</span><b class="num">${res<0?"−":""}${money(Math.abs(res))}</b></div>
  </div>
  ${cats.length?`<div class="card"><h2>En qué se fue la plata</h2><div class="bars">${cats.map(([c,n])=>`<div class="bar"><span>${esc(c)}</span><div class="t"><span style="width:${Math.max(3,n/maxC*100)}%"></span></div><b class="num">${money(n)}</b></div>`).join("")}</div></div>`:""}
  ${cajaCuenta==="Todas"&&Object.keys(byCta).length?`<div class="card"><h2>Neto por cuenta en el mes</h2><div class="list" style="border:0">${CUENTAS.filter(c=>byCta[c]!==undefined).map(c=>`<div class="li" style="padding-inline:0"><span>${c}</span><b class="num ${byCta[c]<0?"neg":"pos"}">${byCta[c]<0?"−":"+"}${money(Math.abs(byCta[c]))}</b></div>`).join("")}</div></div>`:""}
  <div class="card">
    <h2>Nuevo movimiento</h2>
    <div class="chips"><button class="chip" data-tipo="egreso" aria-pressed="${mov.tipo==="egreso"}">Egreso (gasto)</button><button class="chip" data-tipo="ingreso" aria-pressed="${mov.tipo==="ingreso"}">Ingreso</button></div>
    <div class="two">
      <label class="f">Monto<input id="mMonto" inputmode="numeric" class="num" value="${esc(mov.monto)}" placeholder="0"></label>
      <label class="f">Fecha<input id="mFecha" type="date" value="${esc(mov.fecha)}"></label>
    </div>
    <label class="f">Cuenta<select id="mCuenta">${CUENTAS.map(c=>`<option ${mov.cuenta===c?"selected":""}>${c}</option>`).join("")}</select></label>
    <div class="chips" role="group" aria-label="Categoría">${cats2.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${mov.categoria===c}">${c}</button>`).join("")}</div>
    <label class="f">Detalle<input id="mNota" value="${esc(mov.nota)}" placeholder="Ej: compra al proveedor, Correo Argentino, Meta Ads…"></label>
    <button class="primary" id="mSave">Guardar ${mov.tipo==="egreso"?"gasto":"ingreso"}</button>
  </div>
  ${sample?`<div class="card paste"><h2>Pegar resumen o movimientos</h2>
    <div class="hint">Copiá los movimientos del resumen de la tarjeta, del home banking o de Mercado Pago y pegalos acá. Revisás la lista antes de guardar.</div>
    <label class="f">Cuenta de estos movimientos<select id="pCuenta">${CUENTAS.map(c=>`<option ${c==="Tarjeta de crédito"?"selected":""}>${c}</option>`).join("")}</select></label>
    <label class="f"><textarea id="mPaste" rows="4" placeholder="02/11 MERPAGO*PROVEEDORMATES   45.000,00&#10;03/11 FACEBK ADS   12.300,00"></textarea></label>
    <div class="row"><button class="secondary" id="mPasteBtn">Leer movimientos</button><span class="hint" id="mPasteMsg"></span></div>
    ${pasteRows?`<div class="list">${pasteRows.map((r,i)=>`<div class="li"><div class="m"><b>${esc(r.categoria)} · <span style="font-weight:500">${esc(r.nota)}</span></b><small class="num">${esc(r.fecha)} · ${esc(r.cuenta)}${r.dup?` <span style="color:var(--warn);font-weight:600">${esc(r.dup)}</span> <button class="ghost" data-pkeep="${i}">Guardar igual</button>`:""}</small></div><div class="r"><b class="num ${r.tipo==="ingreso"?"pos":"neg"}">${r.tipo==="ingreso"?"+":"−"}${money(r.monto)}</b><button class="ghost danger" data-prm="${i}">Quitar</button></div></div>`).join("")}</div>
      <div class="row"><button class="primary" id="pSaveAll" style="flex:1">Guardar ${pasteRows.filter(r=>!r.dup).length} movimiento${pasteRows.filter(r=>!r.dup).length===1?"":"s"}</button><button class="ghost" id="pDiscard">Descartar</button></div>`:""}
  </div>`:""}
  ${list?`<div class="list">${list}</div>`:`<div class="empty">${(loaded.m||!db)?"Sin movimientos este mes. Las ventas que marques como pagadas aparecen acá solas.":"Cargando…"}</div>`}`;
}
const vc=$("#v-caja");
vc.addEventListener("input",e=>{const t=e.target;
  if(t.id==="mMonto")mov.monto=t.value.replace(/[^\d]/g,"");
  if(t.id==="mFecha")mov.fecha=t.value;
  if(t.id==="mNota")mov.nota=t.value;});
vc.addEventListener("change",e=>{if(e.target.id==="mCuenta")mov.cuenta=e.target.value});
vc.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.cta){cajaCuenta=d.cta;renderCaja()}
  else if(d.tipo){mov.tipo=d.tipo;mov.categoria=d.tipo==="egreso"?"Proveedor":"Aporte";renderCaja()}
  else if(d.cat){mov.categoria=d.cat;renderCaja()}
  else if(d.mdel){if(delArm!=="m"+d.mdel){delArm="m"+d.mdel;renderCaja();return}delArm=null;guard(()=>db.doc("movimientos/"+d.mdel).delete(),"Movimiento borrado")}
  else if(d.pkeep){delete pasteRows[+d.pkeep].dup;renderCaja()}
  else if(d.prm){pasteRows.splice(+d.prm,1);if(!pasteRows.length)pasteRows=null;renderCaja()}
  else if(b.id==="pDiscard"){pasteRows=null;renderCaja()}
  else if(b.id==="mSave"){const monto=+mov.monto||0;if(!monto){toast("Poné el monto");return}
    b.disabled=true;const ok=await guard(()=>db.collection("movimientos").add({tipo:mov.tipo,monto,fecha:mov.fecha||today(),cuenta:mov.cuenta,categoria:mov.categoria,nota:mov.nota.trim(),creado:Date.now()}),mov.tipo==="egreso"?"Gasto guardado":"Ingreso guardado");

/* ---------- sellos ----------
   El panel original corre intacto en un marco. Cree guardar en el navegador, pero el puente
   (#panelShim) le pasa cada cambio al CRM, que lo escribe en customers, coupons, orders y
   config/main, y le devuelve lo que llega de la base. */
const SELLOS_COLS=["customers","coupons","orders"], SELLOS_MAX=5;
let sDb={}, sPanel=null, sQueue=[], sBusy=false, sFrame=null, sReady=false, sErr=false, sTimer=0;
const sLoaded=new Set();
const sClone=o=>JSON.parse(JSON.stringify(o));
const sStable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const sValid=k=>/^(customers|coupons|orders|config)\/[A-Za-z0-9_.~:@+-]{1,200}$/.test(k);
function sFail(){sErr=true;if(tab==="sellos")ensurePanel()}
function sMark(n,snap){if(!snap.metadata?.fromCache)sLoaded.add(n);sSync();if(tab==="clientes")renderAll();if(tab==="sellos")ensurePanel()}
function initSellos(){
  SELLOS_COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{
    Object.keys(sDb).forEach(k=>{if(k.startsWith(c+"/"))delete sDb[k]});
    snap.docs.forEach(d=>{sDb[c+"/"+d.id]=sClone(d.data()||{})});
    sMark(c,snap);
  },sFail));
  db.doc("config/main").onSnapshot(s=>{
    if(s.exists)sDb["config/main"]=sClone(s.data()||{});else delete sDb["config/main"];
    sMark("config",s);
  },sFail);
}
function sSync(){clearTimeout(sTimer);sTimer=setTimeout(()=>{
  if(!sReady||sBusy||sQueue.length||sStable(sDb)===sStable(sPanel))return;
  sPanel=sClone(sDb);sFrame.contentWindow.postMessage({sellos:"state",json:JSON.stringify(sPanel)},"*");
},150)}
function sSave(json){
  let next;try{next=JSON.parse(json)}catch(e){return}
  const prev=sPanel||{};
  Object.keys(next).forEach(k=>{if(sValid(k)&&sStable(next[k])!==sStable(prev[k]))sQueue.push([k,next[k]])});
  Object.keys(prev).forEach(k=>{if(!(k in next))sQueue.push([k,null])});
  sPanel=next;sDrain();
}
async function sDrain(){
  if(sBusy)return;sBusy=true;
  while(sQueue.length){
    const [k,v]=sQueue[0];
    try{
      if(!canWrite)throw {code:"read_only"};
      if(v===null)await db.doc(k).delete();else await db.doc(k).set(v);
      sQueue.shift();
    }catch(e){
      sQueue=[];sPanel=null;
      toast(e.code==="read_only"?"Tenés acceso solo de lectura":e.code==="quota_exceeded"?"La base está llena":"No se pudo guardar el sello. Probá de nuevo.");
    }
  }
  sBusy=false;sSync();
}
function ensurePanel(){
  if(sFrame)return;
  const box=$("#sBox");
  if(!db){box.textContent="Abrí esta app desde Claude con tu cuenta para ver los sellos.";return}
  if(sErr){box.textContent="No se pudieron leer los sellos. Revisá la conexión y volvé a abrir la app.";return}
  if(sLoaded.size<4){box.textContent="Cargando sellos…";return}
  const bytes=Uint8Array.from(atob($("#panelB64").textContent.trim()),c=>c.charCodeAt(0));
  const html=new TextDecoder().decode(bytes);
  sPanel=sClone(sDb);
  const init=JSON.stringify(JSON.stringify(sPanel)).replace(/</g,"\\u003c");
  const shim=$("#panelShim").textContent.replace("__INIT__",()=>init);
  const at=html.indexOf("<head>")+6;
  sFrame=document.createElement("iframe");
  sFrame.id="panelFrame";sFrame.title="Panel de sellos";sFrame.allow="clipboard-write";
  sFrame.srcdoc=html.slice(0,at)+"<style>#local-hint{display:none!important}</style><script>"+shim+"<\/script>"+html.slice(at);
  $("#v-sellos").appendChild(sFrame);
  setTimeout(()=>{if(!sReady){box.hidden=false;box.textContent="El panel de sellos no pudo abrirse. Volvé a abrir la app."}},12000);
}
window.addEventListener("message",async e=>{
  if(!sFrame||e.source!==sFrame.contentWindow||!e.data)return;const m=e.data;
  if(m.sellos==="ready"){sReady=true;$("#sBox").hidden=true;sSync()}
  else if(m.sellos==="save")sSave(m.json);
  else if(m.sellos==="height")sFrame.style.height=m.h+"px";
  else if(m.sellos==="link"){if(window.__OS_STANDALONE)window.open(m.url,"_blank");else toast(m.copied?"Link copiado. Pegalo en tu navegador.":m.url)}
  else if(m.sellos==="download"){
    if(!downloads){toast("No se puede descargar desde acá");return}
    try{await downloads.save({filename:m.filename,data:m.blob})}catch(_){toast("No se descargó el archivo")}
  }
});

const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function addDays(s,n){const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return ymd(d)}
function addMonths(ym,n){const [y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
const lastDay=ym=>{const [y,m]=ym.split("-").map(Number);return ymd(new Date(y,m,0))};
const pct=(a,b)=>b?Math.round((a-b)/b*100):null;
/* Rango del período y el período anterior comparable. */
function rango(per){
  const h=today(),ym=h.slice(0,7);
  if(per==="Hoy")return {a:h,b:h,pa:addDays(h,-1),pb:addDays(h,-1),vs:"ayer"};
  if(per==="7 días")return {a:addDays(h,-6),b:h,pa:addDays(h,-13),pb:addDays(h,-7),vs:"7 días anteriores"};
  if(per==="Mes anterior"){const p=addMonths(ym,-1),q=addMonths(ym,-2);return {a:p+"-01",b:lastDay(p),pa:q+"-01",pb:lastDay(q),vs:"el mes previo"}}
  const p=addMonths(ym,-1),dia=h.slice(8),fin=p+"-"+dia<=lastDay(p)?p+"-"+dia:lastDay(p);
  return {a:ym+"-01",b:h,pa:p+"-01",pb:fin,vs:"mismos días del mes pasado"};
}
function ventasEn(a,b,canal){return ventas.filter(v=>v.fecha>=a&&v.fecha<=b&&(!canal||canal==="Todos"||v.canal===canal))}
function costoDe(v,pm){let c=0,falta=0;(v.items||[]).forEach(i=>{const p=pm.get(i.pid),k=+p?.costo||0;if(k>0)c+=k*(+i.cant||0);else falta++});return {c,falta}}
function statsDe(vs){
  const pm=new Map(productos.map(p=>[p.id,p]));const s={fact:0,n:vs.length,cobrado:0,pend:0,costo:0,falta:0};
  vs.forEach(v=>{const t=totalOf(v);s.fact+=t;if(v.pago==="pagado")s.cobrado+=t;else s.pend+=t;const k=costoDe(v,pm);s.costo+=k.c;s.falta+=k.falta});
  return s;
}
/* Gastos operativos: los retiros personales no son un gasto del negocio. */
function gastosEn(a,b){return movs.filter(m=>m.tipo==="egreso"&&m.fecha>=a&&m.fecha<=b&&m.categoria!=="Retiro personal"&&m.categoria!==INTERNA).reduce((x,m)=>x+(+m.monto||0),0)}
function marcarDuplicados(arr){
  arr.forEach(r=>{
    const ds=[addDays(r.fecha,-3),addDays(r.fecha,3)];
    if(r.tipo==="ingreso"&&ventas.some(v=>v.pago==="pagado"&&Math.round(totalOf(v))===r.monto&&v.fecha>=ds[0]&&v.fecha<=ds[1]))r.dup="ya está en Ventas";
    else if(movs.some(m=>m.fecha===r.fecha&&+m.monto===r.monto&&m.tipo===r.tipo&&m.cuenta===r.cuenta))r.dup="ya cargado";
  });
  return arr;
}

  stockMovs.forEach(s=>{const x=m.get(s.pid);if(x)x.fisico+=+s.cant||0});

/* ---------- OS: precios y márgenes ----------
   Regla: transferencia = costo × (1 + margen%) + fijo. Tarjeta = transferencia + recargo%.
   Los cambios quedan en borrador (pcD) hasta tocar Guardar: nada se escribe mientras se edita.
   oferta:true protege el precio de los cambios en lote. precioWeb = último precio subido a la página. */
let pcF="Todos", pcQ="", pcD=new Map(), pcLote="", pcArm=false;
const pcCfg=()=>({margen:50,fijo:2000,recargo:33.33,...precioCfg});
const pcRed=n=>Math.round(n/100)*100;
const pcTarjeta=t=>pcRed(t/factorT());
const pcRegla=(c,m)=>{const k=pcCfg();return pcTarjeta(c*(1+(m===undefined?+k.margen:m)/100)+(+k.fijo))};
const pcPct=(c,p,t)=>c>0&&p>0?Math.round((((+t||transf(p))-(+pcCfg().fijo))/c-1)*100):"";
const pcVal=p=>({costo:+p.costo||0,precio:+p.precio||0,precioT:+p.precioT||0,oferta:!!p.oferta,...pcD.get(p.id)});
function pcSet(p,patch){const v={...pcVal(p),...patch};
  if(v.costo===(+p.costo||0)&&v.precio===(+p.precio||0)&&v.precioT===(+p.precioT||0)&&v.oferta===!!p.oferta)pcD.delete(p.id);else pcD.set(p.id,v)}
const pcPend=p=>p.precioWeb!==undefined&&+p.precioWeb!==+p.precio;
const pcFuera=p=>{const v=pcVal(p),x=pcPct(v.costo,v.precio,v.precioT);return x!==""&&!v.oferta&&Math.abs(x-(+pcCfg().margen))>5};
const pcEnWeb=()=>productos.filter(p=>p.webPub!==false);
function pcLista(){const q=norm(pcQ);let l=pcEnWeb().filter(p=>!q||norm(p.nombre).includes(q)||norm(p.sku).includes(q));
  if(pcF==="Fuera de regla")l=l.filter(pcFuera);
  if(pcF==="Ofertas")l=l.filter(p=>pcVal(p).oferta);

function flujoMes(ym){
  const a=ym+"-01",b=lastDay(ym),st=statsDe(ventasEn(a,b));
  const ms=movs.filter(m=>m.fecha>=a&&m.fecha<=b&&m.categoria!==INTERNA);
  const otros=ms.filter(m=>m.tipo==="ingreso").reduce((x,m)=>x+(+m.monto||0),0);
  const egresos=ms.filter(m=>m.tipo==="egreso").reduce((x,m)=>x+(+m.monto||0),0);
  const gastos=gastosEn(a,b);
  return {ym,fact:st.fact,cobrado:st.cobrado,pend:st.pend,costo:st.costo,falta:st.falta,otros,egresos,gastos,neto:st.cobrado+otros-egresos,utilidad:st.fact-st.costo-gastos};
}
function saldosCuenta(){
  const d=finCfg.saldoDesde||"",out={};
  CUENTAS.forEach(c=>out[c]=+finCfg.saldos?.[c]||0);
  ventas.forEach(v=>{if(v.pago==="pagado"&&(v.fecha||"")>=d){const c=cuentaDe(v.medio);out[c]=(out[c]||0)+totalOf(v)}});
  movs.forEach(m=>{if((m.fecha||"")>=d)out[m.cuenta]=(out[m.cuenta]||0)+(m.tipo==="ingreso"?1:-1)*(+m.monto||0)});
  return out;
}
const fijosActivos=()=>recurrentes.filter(r=>r.activo!==false);
const registrado=(id,ym)=>movs.some(m=>m.recurrente===id&&m.periodo===ym);
function proyeccion(){
  const h=today(),lim=addDays(h,30);
  const saldo=Object.values(saldosCuenta()).reduce((a,n)=>a+n,0);
  const cobrar=ventas.filter(v=>v.pago!=="pagado").reduce((a,v)=>a+totalOf(v),0);
  const pagar=deudas.filter(d=>!d.pagado&&(!d.vence||d.vence<=lim)).reduce((a,d)=>a+(+d.monto||0),0);
  const fijos=fijosActivos().reduce((a,r)=>a+(+r.monto||0),0);
  return {saldo,cobrar,pagar,fijos,total:saldo+cobrar-pagar-fijos};
}
function rentabilidad(ym){
  const a=ym+"-01",b=lastDay(ym),pm=new Map(productos.map(p=>[p.id,p])),can={},pro=new Map();
  ventasEn(a,b).forEach(v=>{
    const t=totalOf(v),k=costoDe(v,pm),pc=+finCfg.comisiones?.[v.canal]||0;
    const c=can[v.canal]||(can[v.canal]={canal:v.canal,fact:0,costo:0,com:0,falta:0,pc,n:0});
    c.fact+=t;c.costo+=k.c;c.com+=t*pc/100;c.falta+=k.falta;c.n++;
    (v.items||[]).forEach(i=>{const id=i.pid||"x"+norm(i.nombre),e=pro.get(id)||{nombre:i.nombre,u:0,ing:0,costo:0,ok:true},q=+i.cant||0,co=+pm.get(i.pid)?.costo||0;
      e.u+=q;e.ing+=q*(+i.precio||0);if(co>0)e.costo+=q*co;else e.ok=false;pro.set(id,e)});
  });
  return {canales:Object.values(can).sort((x,y)=>y.fact-x.fact),productos:[...pro.values()].sort((x,y)=>(y.ok?y.ing-y.costo:-1)-(x.ok?x.ing-x.costo:-1))};
}

/* ---------- OS: operaciones y packaging ----------
   El checklist manda sobre "entrega": Despachado = enviado, Entregado = entregado.
   Si la entrega se cambia desde Ventas, los pasos anteriores se dan por hechos.
   El consumo de insumos se calcula desde los pedidos. Al marcar "Packaging terminado" se guarda
   una foto del kit (kitUso), así cambiar un kit o un costo después no reescribe pedidos ya armados.
   El costo de packaging no entra en la utilidad: las compras de insumos ya son gastos en Caja. */
const ETAPAS=[["recibido","Pedido recibido"],["personalizacion","Personalización pendiente"],["diseno_recibido","Diseño recibido"],["diseno_aprobado","Diseño aprobado"],["preparado","Producto preparado"],["packaging","Packaging terminado"],["despachado","Despachado"],["entregado","Entregado"]];
const SOLO_PERSONAL=["personalizacion","diseno_recibido","diseno_aprobado"];
const CAT_INS=["Bolsas","Bolsas de friselina","Stickers","Tarjetas","Papel","Cintas","Protección","Cajas","Embalaje","Otro"];
let insumos=[], insMovs=[], kits=[], opCfg={diasDemora:3,kitDefault:""};
let opV="Pedidos", opF="Todos", opOpen=null, insEdit=null, insMov={tipo:"entrada",cant:"",nota:""}, kitD=null, insQ="";
const blankIns=()=>({nombre:"",categoria:"Bolsas",costo:"",stock0:"",stockMin:"",proveedor:""});
let insD=blankIns();
function initOps(){
  db.collection("insumos").orderBy("nombre").onSnapshot(s=>{insumos=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},()=>{});
  db.collection("insumo_movs").orderBy("creado","desc").onSnapshot(s=>{insMovs=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},()=>{});
  db.collection("kits").orderBy("nombre").onSnapshot(s=>{kits=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},()=>{});
  db.doc("config/operaciones").onSnapshot(s=>{opCfg={diasDemora:3,kitDefault:"",...(s.exists?s.data():{})};renderAll()},()=>{});
}
const esPersonal=v=>v.personalizada!==undefined?!!v.personalizada:/(?<!sin )(grab|personaliz|logo)/i.test((v.items||[]).map(i=>i.nombre).join(" ")+" "+(v.notas||""));
const etapasDe=v=>ETAPAS.filter(([k])=>esPersonal(v)||!SOLO_PERSONAL.includes(k));
const pasosMap=v=>new Map((v.pasos||[]).map(p=>[p.k,p.f]));
function hecho(v,k){
  if(k==="recibido"||v.entrega==="entregado")return true;
  if(v.entrega==="enviado"&&k!=="entregado")return true;
  return pasosMap(v).has(k);
}
const proximo=v=>etapasDe(v).find(([k])=>!hecho(v,k));
const diasDe=f=>Math.round((new Date(today()+"T12:00")-new Date((f||today())+"T12:00"))/864e5);
const demorado=v=>v.entrega==="preparar"&&diasDe(v.fecha)>=(+opCfg.diasDemora||3);
const kitDe=v=>kits.find(k=>k.id===v.kit)||kits.find(k=>k.id===opCfg.kitDefault)||null;
const insById=id=>insumos.find(i=>i.id===id);
const kitCosto=k=>(k?.items||[]).reduce((a,x)=>a+(+insById(x.iid)?.costo||0)*(+x.cant||0),0);
const fotoKit=k=>(k?.items||[]).map(x=>({iid:x.iid,cant:+x.cant||0,costo:+insById(x.iid)?.costo||0}));
const costoPack=v=>v.kitUso?.length?v.kitUso.reduce((a,x)=>a+x.costo*x.cant,0):kitCosto(kitDe(v));
function insStock(){
  const m=new Map();
  insumos.forEach(i=>m.set(i.id,{fisico:+i.stockInicial||0,res:0,disp:0,desde:+i.stockDesde||0}));
  insMovs.forEach(s=>{const x=m.get(s.iid);if(x)x.fisico+=+s.cant||0});
  ventas.forEach(v=>{
    const usado=hecho(v,"packaging"),lista=usado&&v.kitUso?.length?v.kitUso:(kitDe(v)?.items||[]);
    if(!usado&&v.entrega!=="preparar")return;
    lista.forEach(it=>{const x=m.get(it.iid);if(!x||(+v.creado||0)<x.desde)return;const c=+it.cant||0;if(usado)x.fisico-=c;else x.res+=c});
  });
  m.forEach(x=>{x.disp=x.fisico-x.res});
  return m;
}
const insBajos=()=>{const m=insStock();return insumos.filter(i=>{const x=m.get(i.id);return x&&x.disp<=(+i.stockMin||0)})};
async function cambiarPaso(v,k){
  const et=etapasDe(v),i=et.findIndex(e=>e[0]===k);if(i<=0)return;
  const yaHecho=hecho(v,k),map=pasosMap(v),hasta=yaHecho?i:i+1,keys=et.slice(0,hasta).map(e=>e[0]);
  const pasos=keys.filter(x=>x!=="recibido").map(x=>({k:x,f:map.get(x)||today()}));
  const data={pasos,entrega:keys.includes("entregado")?"entregado":keys.includes("despachado")?"enviado":"preparar"};
  if(keys.includes("packaging")){if(!v.kitUso?.length)data.kitUso=fotoKit(kitDe(v))}else data.kitUso=[];
  await guard(()=>db.doc("ventas/"+v.id).update(data));
}

      <div class="meter" role="progressbar" aria-label="Avance del pedido" aria-valuenow="${Math.round(n/et.length*100)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${n/et.length*100}%"></span></div>

        <label class="chk"><input type="checkbox" data-pers="${v.id}" ${esPersonal(v)?"checked":""}> Lleva personalización</label>

        <div class="hint">Costo de packaging: ${kit||v.kitUso?.length?money(costoPack(v)):"sin kit asignado"}${v.kitUso?.length?" (ya armado)":""}</div></div>`:""}
