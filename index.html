function vistaInsumos(){
  const m=insStock(),e=insEdit,x=e&&m.get(e.id),q=norm(insQ);
  const valor=insumos.reduce((a,i)=>{const s=m.get(i.id);return a+(s&&s.fisico>0?s.fisico*(+i.costo||0):0)},0);
  const ym=today().slice(0,7),vm=ventas.filter(v=>(v.fecha||"").startsWith(ym)),cm=vm.reduce((a,v)=>a+costoPack(v),0),con=vm.filter(v=>costoPack(v)>0).length;
  const list=insumos.filter(i=>!q||norm(i.nombre).includes(q)||norm(i.categoria).includes(q)||norm(i.proveedor).includes(q));
  const hist=e?insMovs.filter(s=>s.iid===e.id).slice(0,6):[],d=e?{...e,stock0:""}:insD;
  return `<div class="tiles"><div class="tile hero"><span class="lbl">Valor de insumos</span><b class="num">${money(valor)}</b><small>stock × costo</small></div>
    <div class="tile"><span class="lbl">Insumos</span><b class="num">${insumos.length}</b><small>cargados</small></div>
    <div class="tile"><span class="lbl">Para reponer</span><b class="num">${insBajos().length}</b><small>en stock mínimo o menos</small></div>
    <div class="tile"><span class="lbl">Costo por pedido</span><b class="num">${con?money(cm/con):"—"}</b><small>${con?`promedio de ${con} pedido${con>1?"s":""} del mes`:"asigná un kit para calcularlo"}</small></div></div>
  <div class="card"><h2>${e?"Editar insumo":"Agregar insumo"}</h2>
    <div class="two"><label class="f">Nombre<input id="iN" value="${esc(d.nombre)}"></label><label class="f">Categoría<select id="iC">${selOpts(CAT_INS,d.categoria)}</select></label></div>
    <div class="two"><label class="f">Costo unitario<input id="iK" inputmode="numeric" class="num" value="${+d.costo||""}"></label><label class="f">Stock mínimo<input id="iM" inputmode="numeric" class="num" value="${+d.stockMin||""}"></label></div>
    <div class="two">${e?"":`<label class="f">Cantidad disponible<input id="iS" inputmode="numeric" class="num" value="${esc(d.stock0)}"></label>`}<label class="f">Proveedor<input id="iP" value="${esc(d.proveedor)}"></label></div>
    <div class="row"><button class="secondary" id="iSave">${e?"Guardar":"Agregar"}</button>${e?`<button class="ghost" id="iCancel">Cancelar</button><span style="flex:1"></span><button class="ghost danger" id="iDel">${delArm==="i"+e.id?"Tocá de nuevo para borrar":"Borrar"}</button>`:""}</div></div>
  ${x?`<div class="card"><h2>Stock de ${esc(e.nombre)}</h2><div class="row"><span class="pill">Físico ${x.fisico}</span><span class="pill">Reservado ${x.res}</span><span class="pill ${x.disp<=(+e.stockMin||0)?"warn":"ok"}">Disponible ${x.disp}</span></div>
    <div class="chips">${[["entrada","Entrada"],["salida","Salida"],["ajuste","Contar stock"]].map(([k,l])=>`<button class="chip" data-imt="${k}" aria-pressed="${insMov.tipo===k}">${l}</button>`).join("")}</div>
    <div class="two"><label class="f">${insMov.tipo==="ajuste"?"Cantidad contada":"Cantidad"}<input id="imC" inputmode="numeric" class="num" value="${esc(insMov.cant)}"></label><label class="f">Detalle<input id="imN" value="${esc(insMov.nota)}"></label></div>
    <button class="secondary" id="imSave" style="align-self:flex-start">Registrar</button>
    <div class="hint">Una entrada suma stock pero no carga el gasto: la compra se registra en Caja.</div>
    ${hist.length?`<div class="hist">${hist.map(s=>`<div class="l"><span>${esc(s.fecha)} · ${esc(s.nota||s.tipo)}</span><span class="num">${s.cant>0?"+":"−"}${Math.abs(s.cant)}</span></div>`).join("")}</div>`:""}</div>`:""}
  <div class="row"><input class="search" id="insQ" placeholder="Buscar insumo, categoría o proveedor" value="${esc(insQ)}"></div>
  ${list.length?`<div class="list">${list.map(i=>{const s=m.get(i.id),b=s.disp<=(+i.stockMin||0);return `<div class="li" data-ie="${i.id}" role="button" tabindex="0"><div class="m"><b>${esc(i.nombre)}</b><small>${[i.categoria,i.proveedor].filter(Boolean).map(esc).join(" · ")}</small> <span class="pill ${s.disp<=0?"bad":b?"warn":"ok"}">Disponible ${s.disp}</span></div><div class="r"><b class="num">${money(i.costo)}</b><small>por unidad</small></div></div>`}).join("")}</div>`
  :`<div class="empty">${insumos.length?"Ningún insumo coincide.":"Cargá tus bolsas, stickers, tarjetas, papel, cintas y cajas."}</div>`}`;
}
function vistaKits(){
  const k=kitD;
  return `<div class="card"><h2>Reglas</h2><div class="two"><label class="f">Días para marcar demorado<input id="oDias" inputmode="numeric" class="num" value="${+opCfg.diasDemora||3}"></label><label class="f">Kit principal<select id="oKit"><option value="">Sin kit principal</option>${kits.map(x=>`<option value="${x.id}" ${opCfg.kitDefault===x.id?"selected":""}>${esc(x.nombre)}</option>`).join("")}</select></label></div>
    <div class="hint">El kit principal se usa en los pedidos que no tengan uno elegido.</div><button class="secondary" id="oSave" style="align-self:flex-start">Guardar reglas</button></div>
  <div class="card"><h2>${k?.id?"Editar kit":"Nuevo kit"}</h2>
    ${k?`<label class="f">Nombre del kit<input id="kN" value="${esc(k.nombre)}" placeholder="Ej: Mate simple, Regalo empresarial"></label>
      ${k.items.map((x,i)=>`<div class="row"><select class="search" data-ki="${i}" aria-label="Insumo">${insumos.map(n=>`<option value="${n.id}" ${x.iid===n.id?"selected":""}>${esc(n.nombre)}</option>`).join("")}</select><input class="search" style="flex:0 0 72px" data-kc="${i}" inputmode="numeric" value="${x.cant}" aria-label="Cantidad"><button class="ghost danger" data-kr="${i}" aria-label="Quitar">×</button></div>`).join("")}
      <button class="ghost" id="kAdd" style="align-self:flex-start" ${insumos.length?"":"disabled"}>+ Agregar insumo</button>
      <div class="totbox"><span>Costo del kit</span><b class="num">${money(kitCosto(k))}</b></div>
      <div class="row"><button class="secondary" id="kSave">Guardar kit</button><button class="ghost" id="kCancel">Cancelar</button>${k.id?`<span style="flex:1"></span><button class="ghost danger" id="kDel">${delArm==="k"+k.id?"Tocá de nuevo para borrar":"Borrar"}</button>`:""}</div>`
    :`<div class="hint">Un kit es lo que lleva un pedido: por ejemplo, 1 bolsa, 2 stickers y 1 tarjeta.</div><button class="secondary" id="kNew" style="align-self:flex-start" ${insumos.length?"":"disabled"}>Crear kit</button>${insumos.length?"":`<div class="hint">Primero cargá tus insumos.</div>`}`}</div>
  ${kits.length?`<div class="list">${kits.map(x=>`<div class="li" data-ke="${x.id}" role="button" tabindex="0"><div class="m"><b>${esc(x.nombre)}</b><small>${esc((x.items||[]).map(y=>`${y.cant}× ${insById(y.iid)?.nombre||"insumo borrado"}`).join(", "))}</small> ${opCfg.kitDefault===x.id?`<span class="pill ok">Principal</span>`:""}</div><div class="r"><b class="num">${money(kitCosto(x))}</b><small>por pedido</small></div></div>`).join("")}</div>`:""}`;
}
function renderOperaciones(){
  const V={"Pedidos":vistaPedidos,"Insumos":vistaInsumos,"Kits y reglas":vistaKits};
  $("#v-operaciones").innerHTML=`<div class="chips">${Object.keys(V).map(c=>`<button class="chip" data-ov="${c}" aria-pressed="${opV===c}">${c}</button>`).join("")}</div>${V[opV]()}`;
}
const vo=$("#v-operaciones");
vo.addEventListener("input",e=>{const t=e.target,d=t.dataset,box=insEdit||insD;
  const m={iN:"nombre",iK:"costo",iM:"stockMin",iS:"stock0",iP:"proveedor"}[t.id];
  if(m)box[m]=["iK","iM","iS"].includes(t.id)?t.value.replace(/\D/g,""):t.value;
  if(t.id==="imC")insMov.cant=t.value.replace(/\D/g,"");if(t.id==="imN")insMov.nota=t.value;
  if(t.id==="kN")kitD.nombre=t.value;if(d.kc!==undefined)kitD.items[+d.kc].cant=+t.value.replace(/\D/g,"")||0;
  if(t.id==="insQ"){insQ=t.value;const p=t.selectionStart;renderOperaciones();const n=$("#insQ");n.focus();n.setSelectionRange(p,p)}});
vo.addEventListener("change",e=>{const t=e.target,d=t.dataset;
  if(t.id==="iC")(insEdit||insD).categoria=t.value;
  if(d.ki!==undefined){kitD.items[+d.ki].iid=t.value;t.blur();renderOperaciones()}
  if(d.pc){const v=ventas.find(x=>x.id===d.v);t.blur();cambiarPaso(v,d.pc)}
  if(d.pers){t.blur();guard(()=>db.doc("ventas/"+d.pers).update({personalizada:t.checked}))}
  if(d.kit){t.blur();guard(()=>db.doc("ventas/"+d.kit).update({kit:t.value}))}});
vo.addEventListener("click",async e=>{
  const ie=e.target.closest("[data-ie]");if(ie){insEdit={...insumos.find(i=>i.id===ie.dataset.ie)};insMov={tipo:"entrada",cant:"",nota:""};delArm=null;renderOperaciones();window.scrollTo({top:0});return}
  const ke=e.target.closest("[data-ke]");if(ke){const k=kits.find(x=>x.id===ke.dataset.ke);kitD=JSON.parse(JSON.stringify({items:[],...k}));delArm=null;renderOperaciones();window.scrollTo({top:0});return}
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.ov){opV=d.ov;delArm=null;renderOperaciones()}
  else if(d.of){opF=d.of;renderOperaciones()}
  else if(d.oo){opOpen=opOpen===d.oo?null:d.oo;renderOperaciones()}
  else if(d.paso){b.disabled=true;cambiarPaso(ventas.find(x=>x.id===d.v),d.paso)}
  else if(d.imt){insMov.tipo=d.imt;renderOperaciones()}
  else if(d.kr!==undefined){kitD.items.splice(+d.kr,1);renderOperaciones()}
  else if(b.id==="iCancel"){insEdit=null;renderOperaciones()}
  else if(b.id==="iSave"){const s=insEdit||insD,nombre=String(s.nombre||"").trim();if(!nombre){toast("Falta el nombre");return}
    const data={nombre,categoria:s.categoria,costo:+s.costo||0,stockMin:+s.stockMin||0,proveedor:String(s.proveedor||"").trim()};
    const ok=insEdit?await guard(()=>db.doc("insumos/"+insEdit.id).update(data),"Insumo guardado"):await guard(()=>db.collection("insumos").add({...data,stockInicial:+s.stock0||0,stockDesde:Date.now(),creado:Date.now()}),"Insumo agregado");
    if(ok){insEdit=null;insD=blankIns();renderOperaciones()}}
  else if(b.id==="iDel"){const id=insEdit.id;if(delArm!=="i"+id){delArm="i"+id;renderOperaciones();return}
    if(kits.some(k=>(k.items||[]).some(x=>x.iid===id))){delArm=null;toast("Está en un kit: sacalo del kit primero");renderOperaciones();return}
    delArm=null;insEdit=null;guard(()=>db.doc("insumos/"+id).delete(),"Insumo borrado")}
  else if(b.id==="imSave"){const x=insStock().get(insEdit.id),n=+insMov.cant;if(insMov.cant===""){toast("Poné la cantidad");return}
    const cant=insMov.tipo==="entrada"?n:insMov.tipo==="salida"?-n:n-x.fisico;if(!cant){toast("No hay diferencia para registrar");return}
    if(await guard(()=>db.collection("insumo_movs").add({iid:insEdit.id,tipo:insMov.tipo,cant,nota:insMov.nota.trim(),fecha:today(),creado:Date.now()}),"Stock actualizado")){insMov={tipo:insMov.tipo,cant:"",nota:""};renderOperaciones()}}
  else if(b.id==="kNew"){kitD={nombre:"",items:[{iid:insumos[0].id,cant:1}]};renderOperaciones()}
  else if(b.id==="kAdd"){kitD.items.push({iid:insumos[0].id,cant:1});renderOperaciones()}
  else if(b.id==="kCancel"){kitD=null;renderOperaciones()}
  else if(b.id==="kSave"){const nombre=kitD.nombre.trim(),items=kitD.items.filter(x=>x.cant>0).map(x=>({iid:x.iid,cant:x.cant}));
    if(!nombre||!items.length){toast("Poné el nombre y al menos un insumo");return}
    const id=kitD.id,ok=id?await guard(()=>db.doc("kits/"+id).update({nombre,items}),"Kit guardado"):await guard(()=>db.collection("kits").add({nombre,items,creado:Date.now()}),"Kit creado");
    if(ok){kitD=null;renderOperaciones()}}
  else if(b.id==="kDel"){const id=kitD.id;if(delArm!=="k"+id){delArm="k"+id;renderOperaciones();return}delArm=null;kitD=null;guard(()=>db.doc("kits/"+id).delete(),"Kit borrado")}
  else if(b.id==="oSave"){const dias=+$("#oDias").value.replace(/\D/g,"");if(!(dias>=1&&dias<=60)){toast("Los días van de 1 a 60");return}
    guard(()=>db.doc("config/operaciones").set({diasDemora:dias,kitDefault:$("#oKit").value}),"Reglas guardadas")}
});
vo.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.dataset.ie||e.target.dataset.ke))e.target.click()});

/* ---------- OS: clientes y fidelización ----------
   Un cliente se arma con sus ventas, su ficha (colección clientes) y su tarjeta de sellos.
   La clave es el teléfono o, si no hay, el nombre: una venta sin teléfono se une al cliente
   del mismo nombre. Los sellos solo se leen: se modifican únicamente desde el panel. */
const CLI_DEF={vipMonto:500000,inactivoDias:90,beneficios:[]};
const SEGS=["Todos","Nuevos","Frecuentes","VIP","Inactivos","Empresas","Premio pendiente"];
let fichas=[], contactos=[], cliCfg={...CLI_DEF}, cliV="Clientes", cliSeg="Todos", cliOpen=null, cliD=null, cliNota="", cliAlta=false, fidF="Todas", fidEdit=false;
function initCli(){
  db.collection("clientes").orderBy("creado","desc").onSnapshot(s=>{fichas=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},()=>{});
  db.collection("contactos").orderBy("creado","desc").onSnapshot(s=>{contactos=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},()=>{});
  db.doc("config/clientes").onSnapshot(s=>{cliCfg={...CLI_DEF,...(s.exists?s.data():{})};renderAll()},()=>{});
}
const telKey=t=>String(t||"").replace(/\D/g,"").slice(-8);
function telsPorNombre(){const m=new Map();[...ventas,...fichas].forEach(v=>{const n=norm(v.nombre),t=telKey(v.tel);if(n&&t&&!m.has(n))m.set(n,t)});return m}
const cliKey=(r,tm)=>telKey(r.tel)||tm.get(norm(r.nombre))||norm(r.nombre);
const cliDocId=k=>"c-"+k.replace(/[^a-z0-9]/g,"-").slice(0,120);
const selloCust=()=>Object.keys(sDb).filter(k=>k.startsWith("customers/")).map(k=>sDb[k]);
function clientesAll(){
  const tm=telsPorNombre(),m=new Map();
  const get=(nombre,tel)=>{const k=cliKey({nombre,tel},tm);let c=m.get(k);if(!c){c={k,nombre,tel:tel||"",n:0,tot:0,ult:"",pri:"",pend:0,emp:false,compras:[],ficha:null,sello:null};m.set(k,c)}return c};
  ventas.forEach(v=>{if(!v.nombre)return;const c=get(v.nombre,v.tel),t=totalOf(v);c.n++;c.tot+=t;if(v.pago!=="pagado")c.pend+=t;if(v.canal==="Empresas")c.emp=true;c.compras.push(v);
    if((v.fecha||"")>c.ult){c.ult=v.fecha;c.nombre=v.nombre;c.tel=v.tel||c.tel}if(!c.pri||(v.fecha||"")<c.pri)c.pri=v.fecha});
  fichas.forEach(f=>{if(!f.nombre)return;const c=get(f.nombre,f.tel);c.ficha=f;if(!c.tel)c.tel=f.tel||""});
  selloCust().forEach(s=>{if(!s.name)return;const c=get(s.name,"");c.sello=s});
  m.forEach(c=>c.compras.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")));
  return [...m.values()];
}
function segsDe(c){
  const s=[],h=today(),tags=(c.ficha?.etiquetas||[]).map(norm);
  if(c.n&&c.pri>=addDays(h,-30))s.push("Nuevos");
  if(c.n>=3)s.push("Frecuentes");
  if(c.tot>=(+cliCfg.vipMonto||Infinity)||tags.includes("vip"))s.push("VIP");
  if(c.n&&c.ult<addDays(h,-(+cliCfg.inactivoDias||90)))s.push("Inactivos");
  if(c.emp||tags.includes("empresa"))s.push("Empresas");
  if((+c.sello?.stamps||0)>=SELLOS_MAX)s.push("Premio pendiente");
  return s;
}
function cumpleEn(f,dias){if(!f)return false;const h=today();for(let i=0;i<=dias;i++)if(addDays(h,i).slice(5)===f.slice(5))return true;return false}
const dotsDe=n=>`<div class="dots ${n>=SELLOS_MAX?"full":""}" role="img" aria-label="${n} de ${SELLOS_MAX} sellos">${Array.from({length:SELLOS_MAX},(_,i)=>`<span class="dot ${i<n?"on":""}"></span>`).join("")}</div>`;
const fechaCorta=f=>f?new Date(f+"T12:00").toLocaleDateString("es-AR",{day:"numeric",month:"short"}):"-";
function fichaHTML(c){
  const d=cliD,hist=contactos.filter(x=>x.ck===c.k||norm(x.nombre)===norm(c.nombre)).slice(0,5),segs=segsDe(c);
  const ben=(cliCfg.beneficios||[]).filter(b=>segs.includes(b.segmento));
  return `<div class="hist">
    <div class="more3"><div><small class="hint">Total comprado</small><br><b class="num">${money(c.tot)}</b></div><div><small class="hint">Pedidos</small><br><b class="num">${c.n}</b></div><div><small class="hint">Última compra</small><br><b>${fechaCorta(c.ult)}</b></div><div><small class="hint">Deuda</small><br><b class="num">${money(c.pend)}</b></div></div>
    ${c.sello?`<div><small class="hint">Sellos: ${+c.sello.stamps||0} de ${SELLOS_MAX}${+c.sello.cards?` · ${c.sello.cards} tarjeta${c.sello.cards>1?"s":""} completa${c.sello.cards>1?"s":""}`:""}</small>${dotsDe(+c.sello.stamps||0)}</div>`:""}
    ${ben.length?`<div class="hint"><b>Beneficios:</b> ${ben.map(b=>esc(b.texto)).join(" · ")}</div>`:""}
    <div class="two"><label class="f">Teléfono<input data-cf="tel" inputmode="tel" value="${esc(d.tel)}"></label><label class="f">Email<input data-cf="email" inputmode="email" value="${esc(d.email)}"></label></div>
    <div class="two"><label class="f">Dirección<input data-cf="direccion" value="${esc(d.direccion)}"></label><label class="f">Ciudad<input data-cf="ciudad" value="${esc(d.ciudad)}"></label></div>
    <div class="two"><label class="f">Cumpleaños<input data-cf="cumple" type="date" value="${esc(d.cumple)}"></label><label class="f">Etiquetas, separadas por coma<input data-cf="etiquetasTxt" value="${esc(d.etiquetasTxt)}" placeholder="VIP, Empresa, Mayorista"></label></div>
    <label class="f">Preferencias<input data-cf="preferencias" value="${esc(d.preferencias)}"></label>
    <label class="f">Notas<textarea data-cf="notas" rows="2">${esc(d.notas)}</textarea></label>
    <div class="two"><label class="f">Próximo contacto<input data-cf="proximo" type="date" value="${esc(d.proximo)}"></label><label class="f">Motivo<input data-cf="motivo" value="${esc(d.motivo)}"></label></div>
    <div class="row"><button class="secondary" data-csave="1">Guardar ficha</button><button class="ghost" data-newv="1">Nueva venta</button><button class="ghost" data-newq="1">Presupuesto</button>${c.tel?`<button class="ghost" data-ccopy="${esc(c.tel)}">Copiar teléfono</button>`:""}</div>
    <div class="row"><input class="search" id="cNota" placeholder="Registrar contacto: qué hablaron" value="${esc(cliNota)}" aria-label="Registrar contacto"><button class="ghost" data-clog="1">Registrar</button></div>
    ${hist.map(x=>`<div class="l"><span>${fechaCorta(x.fecha)} · ${esc(x.nota)}</span></div>`).join("")}
    ${c.compras.length?`<b style="margin-top:6px">Compras</b>${c.compras.slice(0,6).map(v=>`<div class="l"><span>${fechaCorta(v.fecha)} · ${esc((v.items||[]).map(i=>i.nombre).join(", ")||"Sin productos")}</span><span class="num">${money(totalOf(v))}</span></div>`).join("")}`:""}
  </div>`;
}
function vistaClientes(){
  const all=clientesAll().sort((a,b)=>b.tot-a.tot||norm(a.nombre).localeCompare(norm(b.nombre)));
  const cnt={};SEGS.forEach(s=>cnt[s]=s==="Todos"?all.length:all.filter(c=>segsDe(c).includes(s)).length);
  const q=norm(cliQ);let list=cliSeg==="Todos"?all:all.filter(c=>segsDe(c).includes(cliSeg));
  if(q)list=list.filter(c=>norm(c.nombre).includes(q)||(c.tel||"").includes(cliQ)||norm(c.ficha?.email).includes(q)||norm(c.ficha?.ciudad).includes(q));
  renderClientes.list=list;
  return `<div class="row"><input class="search" id="cliQ" placeholder="Buscar nombre, teléfono, email o ciudad" value="${esc(cliQ)}"><button class="secondary" id="cAlta">${cliAlta?"Cancelar":"+ Cliente"}</button></div>
  ${cliAlta?`<div class="card"><h2>Nuevo cliente</h2><div class="two"><label class="f">Nombre<input id="naN"></label><label class="f">Teléfono<input id="naT" inputmode="tel"></label></div><button class="secondary" id="naS" style="align-self:flex-start">Crear ficha</button></div>`:""}

/* ---------- OS: lector de pedidos sin IA ----------
   Lee un mensaje con reglas y el catálogo: no usa internet ni créditos. Las palabras raras pesan más
   que las comunes ("rosario" dice más que "mate") y "sin grabado" o "con grabado" se tratan como una
   sola palabra, para distinguir variantes. Siempre se revisa antes de guardar. */
const PED_STOP=new Set("hola buenas buenos dias tardes noches quiero quisiera queria necesito necesitaria me gustaria podrias podes pasame pedido pedir comprar compra encargar encargo dame mandame enviame para por de del la el los las lo un una unos unas al a en y o e con sin que mi mis tu su es soy llamo nombre tel telefono cel celular whatsapp wsp pago pagar abono transferencia transfer efectivo tarjeta mercado pago mp cuotas gracias saludos envio envios cliente precio total hay tenes tienen stock si no favor porfa".split(" "));
const PED_NUM={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,doce:12};
const pedRaiz=w=>w.length>4&&w.endsWith("es")?w.slice(0,-2):w.length>3&&w.endsWith("s")?w.slice(0,-1):w;
function pedTokens(s){
  const t=norm(s).replace(/\bsin\s+grab\w*/g," singrabado ").replace(/\bcon\s+grab\w*/g," congrabado ").replace(/\bgrabado\s+en\s+virola/g," congrabado ").replace(/\bsin\s+bombilla/g," sinbombilla ").replace(/\bsin\s+caja/g," sincaja ").replace(/\bcon\s+caja/g," concaja ").replace(/\bpico\s+de\s+loro\b/g," pdl ");
  return t.split(/[^a-z0-9ñ]+/).filter(w=>w&&!PED_STOP.has(w)&&!/^\d+$/.test(w)).map(pedRaiz);
}
function pedIndice(){
  const key=productos.length+"|"+(productos[0]?.id||"");if(pedIndice.k===key)return pedIndice.v;
  const df=new Map(),L=productos.map(p=>{const t=[...new Set(pedTokens(p.nombre))];t.forEach(w=>df.set(w,(df.get(w)||0)+1));return {p,t:new Set(t),n:norm(p.nombre)}});
  const N=Math.max(productos.length,1);pedIndice.k=key;pedIndice.v={L,df,idf:w=>df.has(w)?Math.log(1+N/df.get(w)):0};return pedIndice.v;
}
/* Devuelve los candidatos ordenados: score es la parte del texto que el producto explica. */
function pedBuscar(txt){
  const I=pedIndice(),q=[...new Set(pedTokens(txt))].filter(w=>I.df.has(w));if(!q.length)return [];
  const tot=q.reduce((a,w)=>a+I.idf(w),0);
  return I.L.map(e=>{const hit=q.filter(w=>e.t.has(w)).reduce((a,w)=>a+I.idf(w),0);return {p:e.p,score:hit/tot,extra:e.t.size-q.filter(w=>e.t.has(w)).length,peso:hit}}).filter(x=>x.score>=.6).sort((a,b)=>b.score-a.score||a.extra-b.extra||a.p.nombre.length-b.p.nombre.length);

function pedCant(s){const m=norm(s);let r;
  if((r=m.match(/(?:^|[\s(])(\d{1,3})\s*(?:x|×|u\.?|unidades?)(?=\s|$)/))||(r=m.match(/(?:^|\s)x\s*(\d{1,3})(?=\s|$)/))||(r=m.match(/(?:^|\s)(\d{1,3})(?=\s+[a-zñ])/)))return Math.max(1,+r[1]);
  const w=m.match(/\b(un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|doce)\b/);return w?PED_NUM[w[1]]:1;
}
const pedPrecio=s=>{const m=s.match(/\$\s*([\d.,]+)/);return m?+m[1].replace(/[.,](\d{2})$/,"").replace(/[.,]/g,"")||0:0};
function leerPedido(txt){
  const r={nombre:"",tel:"",canal:"",medio:"",items:[],dudas:[],sueltos:[],envio:0,notas:[]};let s=" "+txt.replace(/\r/g,"")+" ";
  const quitar=m=>{s=s.replace(m," ")};
  let m=s.match(/(?:soy|me llamo|mi nombre es|nombre\s*:|cliente\s*:|a nombre de)\s*([A-Za-zÁÉÍÓÚÑáéíóúñ']+(?:[ ]+[A-ZÁÉÍÓÚÑ][a-záéíóúñ']+){0,3})/i);
  if(m){r.nombre=m[1].trim();quitar(m[0])}
  m=s.match(/(?:tel[eé]?f?o?n?o?|cel(?:ular)?|whatsapp|wsp)?\s*:?\s*(\+?\d[\d\s\-().]{6,16}\d)/i);
  if(m){const d=m[1].replace(/\D/g,"");if(d.length>=8&&d.length<=13){r.tel=m[1].trim();quitar(m[0])}}
  m=s.match(/env[ií]o\s*:?\s*\$?\s*([\d.,]{3,})/i);if(m){r.envio=+m[1].replace(/[.,]/g,"")||0;quitar(m[0])}
  const n=norm(s);
  if(/\btransfer|\bcbu\b|\balias\b/.test(n))r.medio="Transferencia";else if(/\btarjeta|mercado\s*pago|\bmp\b|\bcuotas\b/.test(n))r.medio="Tarjeta / MP";else if(/\befectivo\b/.test(n))r.medio="Efectivo";
  if(/mercado\s*libre|\bmeli\b/.test(n))r.canal="Mercado Libre";else if(/empretienda|tienda online|\bpedido\s*#|\border\b/.test(n))r.canal="Web";else if(/\bs\.?a\.?\b|\bs\.?r\.?l\.?\b|\bempresa/.test(n))r.canal="Empresas";
  m=s.match(/(?:direcci[oó]n|domicilio|entregar en|enviar a|env[ií]o a|mandar a)\s*:?\s*([^\n,;]+(?:,\s*[^\n,;]+)?)/i);if(m){r.notas.push("Dirección: "+m[1].trim());quitar(m[0])}
  m=s.match(/(?:grabar|grabado\s*:|que diga|con el nombre)\s*:?\s*["“]?([^\n"”,.]+)/i);if(m&&!/^\s*(en|de)\b/i.test(m[1]))r.notas.push("Grabado: "+m[1].trim());
  /* 1) nombres completos del catálogo, primero los más largos */

  [...I.L].sort((a,b)=>b.n.length-a.n.length).forEach(e=>{let i;while(e.n.length>6&&(i=low.indexOf(e.n))>=0){
    /* solo se saca el producto con su cantidad y precio: el resto del renglón puede tener otro pedido */
    const antes=low.slice(0,i).match(/(?:(?:^|\s)(?:\d{1,3}\s*(?:x|×)?|x\s*\d{1,3}|un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|doce))\s*$/),ini=antes?i-antes[0].length:i;
    const desp=low.slice(i+e.n.length).match(/^\s*(?:x\s*\d{1,3})?\s*(?:\$\s*[\d.,]+)?/),fin=i+e.n.length+desp[0].length;
    pegar(e.p,(antes?antes[0]:"")+" "+desp[0],pedPrecio(desp[0]),null,orig.indexOf(e.n));low=low.slice(0,ini)+"\n"+low.slice(fin)}});
  /* 2) el resto, por partes; dos partes seguidas pueden ser un solo producto ("yerbero y azucarero") */
  const partes=low.split(/\n|[,;]|\s+y\s+|\s+e\s+|\s\+\s|\s-\s/).map(x=>x.trim()).filter(Boolean);
  for(let i=0;i<partes.length;i++){
    const c=partes[i],sig=pedTokens(c);if(!sig.length)continue;
    if(partes[i+1]){const j=pedBuscar(c+" "+partes[i+1]),a=pedBuscar(c)[0],b=pedBuscar(partes[i+1])[0];if(j[0]?.score===1&&(!a||!b||a.p===b.p||j[0].peso>Math.max(a.peso,b.peso)*1.25)&&pedTokens(partes[i+1]).length){const t=c+" "+partes[i+1];pegar(j[0].p,t,pedPrecio(t),j.slice(1,5).filter(x=>x.score===1).map(x=>x.p));i++;continue}}
    const h=pedBuscar(c);
    if(h.length){const ig=h.filter(x=>x.score>=h[0].score-.001),pos=orig.indexOf(c);pegar(h[0].p,c,pedPrecio(c),ig.slice(1,5).map(x=>x.p),pos<0?undefined:pos)}

  }

}

/* ---------- OS: sellos automáticos ----------

const ETAPAS_B2B=["Prospecto","Contactado","Presupuesto enviado","Negociación","Ganada","Perdida"];
const EMP_TXT=[["empresa","Empresa"],["rubro","Rubro"],["contacto","Contacto"],["email","Email"],["whatsapp","WhatsApp"],["ubicacion","Ubicación"],["responsable","Responsable comercial"],["personalizacion","Personalización"]];
let oportunidades=[], empD=null, empQ="", empF="Todas";
const blankOp=()=>({empresa:"",rubro:"",contacto:"",email:"",whatsapp:"",ubicacion:"",responsable:"",personalizacion:"",estado:"Prospecto",valor:"",cantidad:"",prob:"",seguimiento:"",notas:""});
function initEmp(){db.collection("oportunidades").orderBy("creado","desc").onSnapshot(s=>{oportunidades=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},()=>{})}
const opAbierta=o=>!["Ganada","Perdida"].includes(o.estado);
const opVencida=o=>opAbierta(o)&&o.seguimiento&&o.seguimiento<today();

  const form=d?`<div class="card"><h2>${d.id?"Editar oportunidad":"Nueva oportunidad"}</h2>
    <div class="more3">${EMP_TXT.map(([k,l])=>`<label class="f">${l}<input data-ef="${k}" value="${esc(d[k])}"></label>`).join("")}</div>

    <div class="row"><button class="secondary" id="eSave">Guardar</button><button class="ghost" id="eCancel">Cancelar</button>${d.id?`<span style="flex:1"></span><button class="ghost danger" id="eDel">${delArm==="e"+d.id?"Tocá de nuevo para borrar":"Borrar"}</button>`:""}</div></div>`:"";
  const card=o=>{const i=ETAPAS_B2B.indexOf(o.estado),docs=documentos.filter(x=>x.oportunidad===o.id);
    return `<article class="venta"><div class="who"><b>${esc(o.empresa)}</b><div class="items">${esc([o.contacto,o.rubro].filter(Boolean).join(" · ")||"Sin contacto")}</div></div>

      ${docs.length?`<div class="hint">${docs.map(x=>esc(x.numero)+" "+money(docTotal(x))).join(" · ")}</div>`:""}
      <div class="vfoot">${i>0?`<button class="adj2" data-mv="-1" data-id="${o.id}" aria-label="Etapa anterior">‹</button>`:""}${i<ETAPAS_B2B.length-1?`<button class="adj2" data-mv="1" data-id="${o.id}" aria-label="Etapa siguiente">›</button>`:""}<span class="sp"></span><button class="ghost" data-eq="${o.id}">Presupuesto</button><button class="ghost" data-ee="${o.id}">Editar</button></div></article>`};
  $("#v-empresas").innerHTML=`<div class="tiles"><div class="tile hero"><span class="lbl">Pipeline abierto</span><b class="num">${money(total)}</b><small>${ab.length} oportunidad${ab.length===1?"":"es"}</small></div>
    <div class="tile"><span class="lbl">Valor ponderado</span><b class="num">${money(pond)}</b><small>${sinP?`${sinP} sin probabilidad`:"valor × probabilidad"}</small></div>

/* ---------- OS: proveedores y compras ----------
   Recibir una orden suma el stock de los productos con control y guarda los precios pagados.
   Cada movimiento queda atado a la orden, así no se recibe dos veces y se puede deshacer.
   Pasar una orden a "por pagar" crea una deuda en Finanzas: el gasto aparece recién al pagarla. */
const PROV_TXT=[["nombre","Nombre"],["contacto","Contacto"],["tel","Teléfono"],["email","Email"],["web","Web o Instagram"],["productos","Qué vende"],["condiciones","Condiciones"],["plazo","Plazo de entrega"]];
const OC_ESTADOS=["Borrador","Enviada","Recibida","Cancelada"];
let proveedores=[], provPrecios=[], ordenes=[], provPagos=[], prV="Proveedores", prD=null, prOpen=null, prQ="", prPrecio={item:"",costo:""}, cmpQ="", ocD=null, ocProd="", ocOpen=null;
function initProv(){
  db.collection("proveedores").orderBy("nombre").onSnapshot(s=>{proveedores=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},()=>{});
  db.collection("prov_precios").orderBy("creado","desc").onSnapshot(s=>{provPrecios=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},()=>{});
  db.collection("ordenes").orderBy("creado","desc").onSnapshot(s=>{ordenes=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},()=>{});
  db.collection("prov_pagos").orderBy("creado","desc").onSnapshot(s=>{provPagos=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},()=>{});
}
const provDe=id=>proveedores.find(p=>p.id===id);
const ocTotal=o=>(o.items||[]).reduce((a,i)=>a+(+i.costo||0)*(+i.cant||0),0);
const proxOC=()=>"OC-"+String(ordenes.reduce((a,o)=>Math.max(a,+String(o.numero||"").split("-")[1]||0),0)+1).padStart(4,"0");
function comparador(){
  const m=new Map();
  provPrecios.forEach(r=>{const k=norm(r.item),e=m.get(k)||{item:r.item,por:new Map()};const a=e.por.get(r.proveedorId);if(!a||(r.creado||0)>a.creado)e.por.set(r.proveedorId,{costo:+r.costo||0,fecha:r.fecha,creado:r.creado||0,pid:r.proveedorId});m.set(k,e)});
  return [...m.values()].map(e=>({item:e.item,lista:[...e.por.values()].filter(x=>provDe(x.pid)).sort((a,b)=>a.costo-b.costo)})).filter(e=>e.lista.length).sort((a,b)=>a.item.localeCompare(b.item));
}

  ${d?`<div class="card"><h2>${d.id?"Editar proveedor":"Nuevo proveedor"}</h2><div class="more3">${PROV_TXT.map(([k,l])=>`<label class="f">${l}<input data-pv="${k}" value="${esc(d[k])}"></label>`).join("")}</div>

  ${list.length?list.map(p=>{const open=prOpen===p.id,hp=provPrecios.filter(r=>r.proveedorId===p.id),oc=ordenes.filter(o=>o.proveedorId===p.id),pg=provPagos.filter(x=>x.proveedorId===p.id);

      ${open?`<div class="hist">${p.condiciones||p.plazo?`<div class="hint">${esc([p.condiciones,p.plazo].filter(Boolean).join(" · "))}</div>`:""}

        ${oc.length?`<b>Últimas compras</b>${oc.slice(0,4).map(o=>`<div class="l"><span>${esc(o.numero)} · ${esc(o.estado)}</span><span class="num">${money(ocTotal(o))}</span></div>`).join("")}`:""}</div>`:""}</article>`}).join("")

function vistaComparador(){
  const q=norm(cmpQ),all=comparador().filter(e=>!q||norm(e.item).includes(q));

  :`<div class="empty">Agregá precios en cada proveedor para compararlos.</div>`}`;

function vistaOrdenes(){

async function recibir(o,actualizar){
  for(const i of o.items||[]){
    const p=productos.find(x=>x.id===i.pid);
    if(p?.stockControl&&!stockMovs.some(s=>s.orden===o.id&&s.pid===i.pid))await db.collection("stock_movs").add({pid:i.pid,tipo:"entrada",cant:+i.cant,nota:o.numero,orden:o.id,fecha:today(),creado:Date.now()});
    if(+i.costo&&!provPrecios.some(r=>r.orden===o.id&&norm(r.item)===norm(i.nombre)))await db.collection("prov_precios").add({proveedorId:o.proveedorId,item:i.nombre,costo:+i.costo,orden:o.id,fecha:today(),creado:Date.now()});
    if(actualizar&&p&&+i.costo)await db.doc("productos/"+p.id).update({costo:+i.costo});
  }
  await db.doc("ordenes/"+o.id).update({estado:"Recibida",recibida:today()});
}

/* ---------- OS: fotos ----------
   Las fotos se guardan con la capacidad "assets" (solo quien puede editar la app sube fotos).
   En la base queda solo {id, url}; antes de subir se achican a 1600 px para ahorrar espacio. */
async function achicar(file){
  if(!/^image\/(jpeg|png|webp)$/i.test(file.type||""))return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.max(1,Math.round(bmp.width*k));c.height=Math.max(1,Math.round(bmp.height*k));
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);bmp.close?.();
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));return b&&b.size<file.size?b:file}catch(_){return file}
}

   en la colección "fotos" y en el pedido o pago queda solo su id ("fs:" + id). */
const fotosCache={},fotosPend=new Set(),PIX="data:image/gif;base64,R0lGODlhAQABAAAAACw=";
async function aDataUrl(file){
  let bmp;try{bmp=await createImageBitmap(file)}catch(_){throw {code:"unsupported_type"}}
  for(const [max,q] of [[1280,.72],[1000,.6],[800,.5],[640,.45]]){
    const k=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(bmp.width*k));c.height=Math.max(1,Math.round(bmp.height*k));
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);const u=c.toDataURL("image/jpeg",q);
    if(u.length<700000)return u;
  }
  throw {code:"too_large"};
}

/* Lector simple: un pedido por párrafo (o por renglón "Nombre: ..."), productos con el lector de Nueva venta. */
function borLeerLocal(txt){
  const t=String(txt||"").replace(/\r/g,"").trim();if(!t)return [];
  let partes=t.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(partes.length===1){const ls=partes[0].split("\n").map(x=>x.trim()).filter(Boolean);if(ls.length>1&&ls.filter(l=>/^[^:\-–]{2,30}\s*[:\-–]\s*\S/.test(l)).length>=2)partes=ls}
  return partes.map(p=>{
    let cliente="",resto=p;
    const m=p.match(/^\s*(?:pedido\s+(?:de\s+)?)?([A-Za-zÁÉÍÓÚÑáéíóúñ'.]+(?:\s+[A-Za-zÁÉÍÓÚÑáéíóúñ'.]+){0,3})\s*[:\-–]\s*/);
    if(m&&!pedBuscar(m[1]).length){cliente=m[1];resto=p.slice(m[0].length)}
    const r=leerPedido(resto);if(!cliente&&r.nombre)cliente=r.nombre;
    const g=/\bsin\s+grab/i.test(resto)?null:resto.match(/grab\w*\s*(?:que diga|con|:)?\s*["“'‘]?([^"”'’\n,;]+?)(?=\s+y\s+|\s*$|[\n,;"”'’])/i);
    const items=r.items.map(x=>({nombre:x.p.nombre,cant:x.cant,grabado:""}));
    r.sueltos.filter(s=>!/grab/i.test(s)).forEach(s=>items.push({nombre:(s.charAt(0).toUpperCase()+s.slice(1)).slice(0,80),cant:pedCant(s),grabado:""}));
    if(!items.length){const n=resto.split("\n")[0].replace(/\b(con\s+|sin\s+)?grab\w*.*$/i,"").trim();items.push({nombre:n.slice(0,80),cant:1,grabado:""})}
    if(g&&g[1].trim())items[0].grabado=g[1].trim();
    return {cliente:capi(cliente),items,notas:r.notas.filter(n=>!/^Grabado/.test(n)).join(" · ")};
  });
}

function vistaPagos(){
  const lista=provPagos.filter(x=>!pagoProv||x.proveedorId===pagoProv).slice().sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0));
  const ym=today().slice(0,7),y=today().slice(0,4),sum=a=>a.reduce((s,x)=>s+(+x.monto||0),0);
  const mes=lista.filter(x=>(x.fecha||"").startsWith(ym)),anio=lista.filter(x=>(x.fecha||"").startsWith(y));
  const chipsP=[...new Set([...provPagos.map(x=>x.proveedorId),pagoProv].filter(Boolean))].map(provDe).filter(Boolean);
  let body="",lastM="";
  lista.forEach(x=>{const m=(x.fecha||"").slice(0,7);
    if(m!==lastM){lastM=m;const del=lista.filter(z=>(z.fecha||"").slice(0,7)===m);body+=`<div class="mhead"><span>${esc(m?new Date(m+"-15").toLocaleDateString("es-AR",{month:"long",year:"numeric"}):"Sin fecha")}</span><small class="num">${del.length} pago${del.length===1?"":"s"} · ${money(sum(del))}</small></div>`}
    const open=pagoOpen===x.id;
    body+=`<article class="venta"><div class="vhead"><div class="who"><b>${esc(provDe(x.proveedorId)?.nombre||"Proveedor borrado")}</b><div class="items">${esc(fechaCorta(x.fecha))}${x.detalle?" · "+esc(x.detalle):""}</div></div><div class="vtotal num">${money(x.monto)}</div></div>
      ${fotosHTML(x.fotos)}
      ${open&&x.items?.length?`<div class="detail">${x.items.map(i=>`<div class="l"><span>${+i.cant>1?esc(i.cant)+"× ":""}${esc(i.nombre)}</span><span class="num">${money(i.costo)} c/u</span></div>`).join("")}</div>`:""}
      <div class="vfoot">${x.movId?`<span class="pill ok">En Caja</span>`:""}<span class="sp"></span>${x.items?.length?`<button class="ghost" data-pgo="${x.id}">${open?"Ocultar detalle":"Detalle"}</button>`:""}<button class="ghost" data-pge="${x.id}">Editar</button><button class="ghost danger" data-pgx="${x.id}">${delArm==="pg"+x.id?(x.movId?"Tocá de nuevo: se borra también de Caja":"Tocá de nuevo para borrar"):"Borrar"}</button></div></article>`});
  return `<div class="tiles"><div class="tile hero"><span class="lbl">Pagado este mes</span><b class="num">${money(sum(mes))}</b><small>${mes.length} pago${mes.length===1?"":"s"}${pagoProv&&provDe(pagoProv)?" a "+esc(provDe(pagoProv).nombre):""}</small></div><div class="tile"><span class="lbl">Pagado en ${y}</span><b class="num">${money(sum(anio))}</b><small>${anio.length} pago${anio.length===1?"":"s"}</small></div></div>
  ${chipsP.length>1||pagoProv?`<div class="chips"><button class="chip" data-pgf="" aria-pressed="${!pagoProv}">Todos</button>${chipsP.map(p=>`<button class="chip" data-pgf="${p.id}" aria-pressed="${pagoProv===p.id}">${esc(p.nombre)}</button>`).join("")}</div>`:""}
  ${pagoD?formPago(pagoD):`<button class="primary" id="pgNew">+ Registrar pago o visita</button>`}
  ${body||`<div class="empty">${provPagos.length?"Sin pagos para este proveedor.":"Cada vez que vayan a Factory u otro proveedor, cargá acá la foto de la nota y cuánto pagaron."}</div>`}`;
}
async function leerNota(){
  const imgs=await imgsParaIA(pagoFotos);if(!imgs.length){toast("Argenti no puede leer fotos desde acá");return}
  pagoBusy=true;pagoMsg="Argenti está leyendo la nota…";renderProveedores();
  const num=v=>typeof v==="number"?Math.round(v):+String(v??"").replace(/[^\d]/g,"")||0;
  try{
    const pn=provDe(pagoD.proveedorId)?.nombre;
    const r=await sample.json(`Sos el asistente de Argentimate, una tienda argentina de mates. Las imágenes son la nota de pago o remito que nos dio el proveedor${pn?" "+pn:""} cuando fuimos a buscar mercadería.
Respondé SOLO JSON: {"fecha":"AAAA-MM-DD o vacío","total":0,"items":[{"nombre":"","cant":1,"costo":0}],"detalle":""}
total: lo que se pagó, en pesos, número entero. costo: precio por unidad en pesos, número entero. detalle: resumen corto de lo que se llevó (ej: "12 mates imperiales y 6 termos"). Si algo no se lee, dejalo vacío o en 0. No inventes.`,{modelTier:"default",images:imgs});
    const items=(Array.isArray(r?.items)?r.items:[]).map(i=>({nombre:String(i?.nombre||"").trim(),cant:Math.max(1,num(i?.cant)||1),costo:num(i?.costo)})).filter(i=>i.nombre);
    const tot=num(r?.total)||items.reduce((a,i)=>a+i.costo*i.cant,0);
    if(tot)pagoD.monto=String(tot);if(r?.detalle)pagoD.detalle=String(r.detalle).slice(0,140);
    if(/^\d{4}-\d{2}-\d{2}$/.test(r?.fecha||"")&&r.fecha<=today())pagoD.fecha=r.fecha;
    pagoItems=items.length?items:null;
    pagoMsg=tot?"Revisá el monto y el detalle antes de guardar.":"No pude leer el total: completalo a mano.";
  }catch(e){if(IA_OFF.includes(e?.code))sample=null;pagoMsg=e?.code==="rate_limited"?"Argenti está ocupado: probá en un rato o completalo a mano.":"No pude leer la nota: completala a mano."}
  pagoBusy=false;renderProveedores();
}
async function guardarPago(){
  const d=pagoD,monto=+String(d.monto||"").replace(/\D/g,""),prov=provDe(d.proveedorId);
  if(!prov){toast("Elegí el proveedor");return}if(!monto){toast("Poné el monto pagado");return}
  pagoBusy=true;renderProveedores();
  const data={proveedorId:prov.id,fecha:d.fecha||today(),monto,detalle:String(d.detalle||"").trim(),fotos:sinBlob(pagoFotos),items:pagoItems||[]};
  const ok=await guard(async()=>{
    if(d.id){await db.doc("prov_pagos/"+d.id).update(data);return}
    let movId="";
    if(d.caja){const r=await db.collection("movimientos").add({tipo:"egreso",monto,fecha:data.fecha,cuenta:d.cuenta,categoria:"Proveedor",nota:"Pago a "+prov.nombre+(data.detalle?" · "+data.detalle:""),creado:Date.now()});movId=r?.id||""}
    const ref=await db.collection("prov_pagos").add({...data,movId,creado:Date.now()});
    if(d.precios&&pagoItems?.length){let k=0;for(const i of pagoItems.filter(i=>i.costo>0))await db.collection("prov_precios").add({proveedorId:prov.id,item:i.nombre,costo:i.costo,fecha:data.fecha,pago:ref?.id||"",creado:Date.now()+k++})}
  },d.id?"Pago guardado":"Pago registrado");
  pagoBusy=false;
  if(ok){pagoD=null;pagoFotos=[];pagoItems=null;pagoMsg=""}
  renderProveedores();
}
vpr.addEventListener("input",e=>{const t=e.target;if(!pagoD)return;if(t.id==="pgM")pagoD.monto=t.value.replace(/\D/g,"");if(t.id==="pgD")pagoD.detalle=t.value;if(t.id==="pgF")pagoD.fecha=t.value});
vpr.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="pgP"&&pagoD)pagoD.proveedorId=t.value;
  if(t.id==="pgCta"&&pagoD)pagoD.cuenta=t.value;
  if(t.id==="pgCaja"&&pagoD){pagoD.caja=t.checked;renderProveedores()}
  if(t.id==="pgPre"&&pagoD)pagoD.precios=t.checked;
  if(t.id==="pgFile"){const files=[...(t.files||[])];t.value="";if(!files.length||!pagoD)return;if(!assetsCap){toast("No tenés permiso para subir fotos");return}
    pagoMsg="Subiendo foto…";renderProveedores();
    try{await subirA(files,pagoFotos);pagoMsg=sample?"Foto cargada. Si querés, Argenti lee la nota y completa el monto.":"Foto cargada."}catch(err){pagoMsg=errFoto(err)}
    renderProveedores()}
});
vpr.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.pgprov!==undefined){pagoProv=d.pgprov;prV="Pagos";pagoD=null;delArm=null;renderProveedores();window.scrollTo({top:0})}
  else if(d.pgf!==undefined){pagoProv=d.pgf;renderProveedores()}
  else if(b.id==="pgNew"){if(!proveedores.length){toast("Primero cargá el proveedor");prV="Proveedores";prD={...blankProv(),nombre:"Factory"};renderProveedores();return}pagoD=blankPago();pagoFotos=[];pagoItems=null;pagoMsg="";renderProveedores()}
  else if(b.id==="pgCancel"){pagoD=null;pagoFotos=[];pagoItems=null;pagoMsg="";renderProveedores()}
  else if(b.id==="pgRead")leerNota();
  else if(b.id==="pgSave")guardarPago();
  else if(d.pgfrm!==undefined){pagoFotos.splice(+d.pgfrm,1);renderProveedores()}
  else if(d.pgo){pagoOpen=pagoOpen===d.pgo?null:d.pgo;renderProveedores()}
  else if(d.pge){const x=provPagos.find(y=>y.id===d.pge);if(!x)return;pagoD={id:x.id,movId:x.movId||"",proveedorId:x.proveedorId,fecha:x.fecha||today(),monto:String(x.monto||""),detalle:x.detalle||"",caja:false,cuenta:"Efectivo",precios:false};pagoFotos=[...(x.fotos||[])];pagoItems=x.items?.length?x.items:null;pagoMsg="";renderProveedores();window.scrollTo({top:0})}
  else if(d.pgx){const x=provPagos.find(y=>y.id===d.pgx);if(!x)return;if(delArm!=="pg"+x.id){delArm="pg"+x.id;renderProveedores();return}delArm=null;
    guard(async()=>{if(x.movId){try{await db.doc("movimientos/"+x.movId).delete()}catch(_){}}await db.doc("prov_pagos/"+x.id).delete()},"Pago borrado")}
});

/* ---------- navegación ---------- */
function go(t){tab=t;$("#nav").classList.remove("open");$("#moreBtn").setAttribute("aria-expanded","false");document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t?"page":"false"));
  ["inicio","ventas","nueva","clientes","sellos","productos","caja","finanzas","operaciones","cotizador","empresas","proveedores","marketing","automatizaciones","argenti","borradores"].forEach(v=>$("#v-"+v).hidden=v!==t);
  $("#summary").hidden=t!=="ventas"&&t!=="clientes";delArm=null;renderAll();window.scrollTo({top:0})}
document.querySelectorAll("nav.tabs button[data-tab]").forEach(b=>b.onclick=()=>go(b.dataset.tab));
function shift(n){const [y,m]=month.split("-").map(Number);const d=new Date(y,m-1+n,1);month=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");renderAll()}
$("#mPrev").onclick=()=>shift(-1);$("#mNext").onclick=()=>shift(1);
function renderAll(){renderSummary();
  if(tab==="inicio"&&!$("#v-inicio").contains(document.activeElement))renderInicio();
  if(tab==="ventas")renderVentas();
  if(tab==="nueva"&&!nv.contains(document.activeElement))renderNueva();
  if(tab==="nueva"&&nv.contains(document.activeElement)&&!document.activeElement.matches("input,textarea,select"))renderNueva();
  if(tab==="clientes"&&!(vcl.contains(document.activeElement)&&document.activeElement.matches("input,textarea,select")))renderClientes();
  if(tab==="cotizador"&&!(vq.contains(document.activeElement)&&document.activeElement.matches("input,textarea,select")))renderCotizador();
  if(tab==="sellos")ensurePanel();
  if(tab==="marketing"&&!(vm.contains(document.activeElement)&&document.activeElement.matches("input,textarea,select")))renderMarketing();
  if(tab==="automatizaciones"&&!(va.contains(document.activeElement)&&document.activeElement.matches("input,textarea,select")))renderAuto();
  if(tab==="argenti"&&!argBusy&&!(vg.contains(document.activeElement)&&document.activeElement.matches("input,textarea,select")))renderArgenti();
  actualizarBell();
  if(tab==="empresas"&&!(ve.contains(document.activeElement)&&document.activeElement.matches("input,textarea,select")))renderEmpresas();
  if(tab==="proveedores"&&!(vpr.contains(document.activeElement)&&document.activeElement.matches("input,textarea,select")))renderProveedores();
  if(tab==="operaciones"&&!(vo.contains(document.activeElement)&&document.activeElement.matches("input,textarea,select")))renderOperaciones();
  if(tab==="finanzas"&&!(vf.contains(document.activeElement)&&document.activeElement.matches("input,textarea,select")))renderFinanzas();
  if(tab==="productos"&&!vp.contains(document.activeElement)||tab==="productos"&&!document.activeElement.matches("input,textarea"))renderProductos();
  if(tab==="caja"&&!(vc.contains(document.activeElement)&&document.activeElement.matches("input,textarea,select")))renderCaja();
  if(tab==="borradores"&&!(vb.contains(document.activeElement)&&document.activeElement.matches("input,textarea,select")))renderBorradores();
  document.querySelector(".monthnav").style.display=((tab==="ventas"&&!vAll)||tab==="caja"||tab==="finanzas"||(tab==="marketing"&&mkV!=="Seguidores")||(tab==="automatizaciones"&&auV==="Reporte"))?"":"none";
}
init();
